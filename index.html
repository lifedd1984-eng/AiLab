<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>식당 대소동 - 사장님 물건 찾기</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #3b2410;
    --ink-soft: #7a5c3e;
    --paper: #fff8ec;
    --line: #e6d3b3;
    --brand: #ff7043;
    --brand-dark: #e2542a;
    --gold: #f5b301;
    --bad: #e04b4b;
  }

  html, body {
    height: 100%;
    background: #2b1b12;
    color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body { display: flex; justify-content: center; overscroll-behavior: none; }

  #app {
    width: 100%; max-width: 920px; min-height: 100%;
    background: var(--paper);
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }

  .screen { display: none; flex-direction: column; flex: 1; min-height: 0; }
  .screen.on { display: flex; }

  button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }

  .btn {
    background: var(--brand); color: #fff; font-weight: 800;
    padding: 14px 26px; border-radius: 999px;
    box-shadow: 0 4px 0 var(--brand-dark);
    transition: transform .08s, box-shadow .08s; font-size: 17px;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--brand-dark); }
  .btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 3px 0 var(--line); border: 2px solid var(--line); }
  .btn.ghost:active { box-shadow: 0 0 0 var(--line); }

  /* ================= 타이틀 ================= */
  #screen-title {
    align-items: center; justify-content: center; gap: 16px;
    padding: 40px 24px; text-align: center;
    background: radial-gradient(circle at 20% 15%, #ffe2b8 0, transparent 45%),
                radial-gradient(circle at 85% 80%, #ffd9cc 0, transparent 45%), var(--paper);
  }
  .logo-emoji { font-size: 70px; line-height: 1; }
  .logo-emoji span { display: inline-block; animation: bob 2.2s ease-in-out infinite; }
  .logo-emoji span:nth-child(2) { animation-delay: .3s; }
  .logo-emoji span:nth-child(3) { animation-delay: .6s; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-12px) rotate(3deg); } }
  h1 { font-size: 38px; letter-spacing: -1px; }
  .subtitle { color: var(--ink-soft); font-size: 16px; font-weight: 600; line-height: 1.6; }
  .made-by { margin-top: 6px; font-size: 13px; color: var(--ink-soft); opacity: .8; }

  /* ================= 상단바 ================= */
  .topbar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; background: #fff;
    border-bottom: 2px solid var(--line); flex: none;
  }
  .topbar .spacer { flex: 1; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--paper); border: 2px solid var(--line);
    border-radius: 999px; padding: 5px 12px;
    font-weight: 800; font-size: 14px; white-space: nowrap;
  }
  .chip.coin { border-color: #f7dd9a; background: #fff7e0; color: #a97400; }
  .chip.timer { border-color: #cfe6d8; background: #eefaf3; color: #1f7a4f; font-variant-numeric: tabular-nums; }
  .chip.timer.low { border-color: #f3c3c3; background: #fdeeee; color: var(--bad); animation: pulse .6s infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  .back-btn { font-size: 22px; padding: 4px 8px; line-height: 1; }

  /* ================= 식당 선택 ================= */
  #screen-map .map-body { flex: 1; overflow-y: auto; padding: 16px 14px 32px; }
  .map-title { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
  .map-desc { font-size: 14px; color: var(--ink-soft); margin-bottom: 16px; }
  .rest-card {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    background: #fff; border: 3px solid var(--line); border-radius: 20px;
    padding: 14px; margin-bottom: 12px; box-shadow: 0 4px 0 var(--line);
    transition: transform .08s, box-shadow .08s;
  }
  .rest-card:not(.locked):active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .rest-card.locked { opacity: .55; filter: grayscale(.7); cursor: not-allowed; }
  .rest-card.cleared { border-color: #b7e3ca; box-shadow: 0 4px 0 #b7e3ca; }
  .rest-emoji { font-size: 40px; flex: none; width: 56px; text-align: center; }
  .rest-info { flex: 1; min-width: 0; }
  .rest-name { font-size: 18px; font-weight: 800; }
  .rest-meta { font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
  .badge { font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: var(--line); }
  .badge.d1 { background: #dff3e6; color: #1f7a4f; }
  .badge.d2 { background: #fff2cf; color: #a97400; }
  .badge.d3 { background: #ffe0d6; color: #c0472a; }
  .badge.d4 { background: #eadcff; color: #6b3fbf; }
  .badge.d5 { background: #ffd9e6; color: #b02f61; }
  .rest-right { flex: none; font-size: 22px; }

  /* ================= 찾을 물건 목록 ================= */
  .quest {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: #fff;
    border-bottom: 2px solid var(--line); flex: none;
  }
  .boss-face {
    font-size: 26px; flex: none; width: 42px; height: 42px; border-radius: 50%;
    background: var(--paper); border: 2px solid var(--line);
    display: grid; place-items: center;
  }
  .find-list { display: flex; gap: 7px; overflow-x: auto; flex: 1; padding-bottom: 2px; }
  .find-list::-webkit-scrollbar { height: 0; }
  .find-item {
    flex: none; display: flex; flex-direction: column; align-items: center;
    background: var(--paper); border: 2px solid var(--line);
    border-radius: 13px; padding: 4px 9px 3px; min-width: 58px; transition: all .2s;
  }
  .find-item .fi-emoji { font-size: 22px; line-height: 1.15; }
  .find-item .fi-name { font-size: 11px; font-weight: 700; color: var(--ink-soft); white-space: nowrap; }
  .find-item.found { background: #eefaf3; border-color: #a9dcc2; }
  .find-item.found .fi-emoji { filter: grayscale(1); opacity: .4; }
  .find-item.found .fi-name { text-decoration: line-through; color: #2fa36b; }
  .find-item.hinting { animation: hintPop .5s ease-in-out 3; }
  @keyframes hintPop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); background: #fff2cf; } }

  /* ================= 식당 무대 ================= */
  .stage-wrap { flex: 1; min-height: 0; display: grid; place-items: center; padding: 6px; background: #241812; }
  .stage {
    position: relative; width: 100%; max-width: 900px;
    aspect-ratio: 3 / 4; max-height: 100%;
    border-radius: 14px; overflow-x: auto; overflow-y: hidden;
    container-type: inline-size;
    box-shadow: 0 6px 16px rgba(0,0,0,.4);
    touch-action: pan-x; user-select: none; cursor: grab;
    scrollbar-width: none;
  }
  .stage::-webkit-scrollbar { height: 0; }
  .stage.dragging { cursor: grabbing; }
  @media (min-width: 700px) and (orientation: landscape) { .stage { aspect-ratio: 4 / 3; } }
  .stage.shake { animation: shake .3s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  .scene { position: relative; width: 220%; height: 100%; }

  /* --- 벽 / 바닥 --- */
  .wall { position: absolute; inset: 0 0 32% 0; background: var(--wall); }
  .wall::after {           /* 벽지 세로 줄무늬 */
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.13) 0 1.2%, transparent 1.2% 3.4%);
  }
  .wainscot {              /* 벽 아래쪽 나무 굽도리 */
    position: absolute; left: 0; right: 0; bottom: 32%; height: 7%;
    background: var(--wood); border-bottom: .5cqw solid rgba(0,0,0,.25);
  }
  .floor {
    position: absolute; left: 0; right: 0; bottom: 0; height: 32%;
    background: var(--floor);
  }
  .floor::after {          /* 바닥 타일 */
    content: ""; position: absolute; inset: 0;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 .3%, transparent .3% 4%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 .5%, transparent .5% 12%);
  }

  /* --- 벽 장식 --- */
  .deco { position: absolute; z-index: 1; }
  .window {
    background: linear-gradient(180deg,#bfe6ff,#8fd0f5);
    border: .8cqw solid var(--wood); border-radius: .6cqw;
    box-shadow: inset 0 0 0 .3cqw rgba(255,255,255,.5);
    overflow: hidden;
  }
  .window::before, .window::after {
    content: ""; position: absolute; background: var(--wood);
  }
  .window::before { left: 50%; top: 0; bottom: 0; width: .7cqw; transform: translateX(-50%); }
  .window::after { top: 50%; left: 0; right: 0; height: .7cqw; transform: translateY(-50%); }
  .menuboard {
    background: #3a2a20; border: .7cqw solid var(--wood); border-radius: .8cqw;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: .4cqw; color: #ffe9b8; font-weight: 800; padding: .6cqw;
  }
  .menuboard .mb-title { font-size: 2.1cqw; letter-spacing: -.02em; }
  .menuboard .mb-row { font-size: 1.5cqw; opacity: .85; }
  .picture {
    background: var(--accent); border: .7cqw solid var(--wood); border-radius: .5cqw;
    display: grid; place-items: center; font-size: 3cqw;
  }
  .clock {
    background: #fff; border: .7cqw solid var(--wood); border-radius: 50%;
    display: grid; place-items: center; font-size: 2.6cqw;
  }

  /* --- 가구 공통 --- */
  /* z-index 를 줘서 가구와 그 안의 물건이 항상 벽·바닥보다 위에 오게 합니다.
     이게 없으면 화분 뒤처럼 뒤쪽에 놓인 물건이 바닥에 가려서 눌리지 않습니다. */
  .furn { position: absolute; z-index: 1; }
  .deco { z-index: 1; }
  .furn.can-open { cursor: pointer; }
  /* 열 수 있다는 표시. 휴대폰에는 마우스 오버가 없으니 항상 보이게 두고
     살짝 깜빡이게 해서 "여기 눌러봐"를 알려줍니다. 열면 사라집니다. */
  .furn.can-open::after {
    content: "✋"; position: absolute; right: -.6cqw; top: -2.2cqw;
    font-size: 2.4cqw; pointer-events: none;
    opacity: .55; animation: tapMe 2s ease-in-out infinite; transition: opacity .2s;
  }
  .furn.can-open:hover::after { opacity: 1; }
  .furn.can-open.open::after { opacity: 0; animation: none; }
  @keyframes tapMe { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-.6cqw); } }
  .body { position: absolute; inset: 0; border-radius: .8cqw; background: var(--cab); box-shadow: inset 0 -1cqw 0 rgba(0,0,0,.16), 0 .5cqw 0 rgba(0,0,0,.2); }

  /* 안쪽 수납 공간 */
  .inside {
    position: absolute; inset: 6%;
    background: #2a1f19; border-radius: .5cqw;
    display: flex; flex-wrap: wrap; align-content: center; justify-content: center;
    gap: 2%; padding: 4%;
    box-shadow: inset 0 0 1.5cqw rgba(0,0,0,.7);
    opacity: 0; pointer-events: none; transition: opacity .25s .15s;
  }
  .furn.open .inside { opacity: 1; pointer-events: auto; }

  /* 문 */
  .door {
    position: absolute; top: 0; bottom: 0; width: 50%;
    background: var(--cab-door); border: .35cqw solid rgba(0,0,0,.22);
    border-radius: .6cqw; transition: transform .4s ease;
    backface-visibility: hidden;
  }
  .door.l { left: 0; transform-origin: left center; }
  .door.r { right: 0; transform-origin: right center; }
  .door.full { width: 100%; left: 0; transform-origin: left center; }
  .furn.open .door.l, .furn.open .door.full { transform: perspective(60cqw) rotateY(-118deg); }
  .furn.open .door.r { transform: perspective(60cqw) rotateY(118deg); }
  .door .handle {
    position: absolute; top: 42%; width: .8cqw; height: 16%;
    background: #d8d2c4; border-radius: .4cqw; box-shadow: 0 0 .3cqw rgba(0,0,0,.4);
  }
  .door.l .handle { right: 8%; }
  .door.r .handle { left: 8%; }
  .door.full .handle { right: 6%; }

  /* 뚜껑 (쓰레기통) */
  .lid {
    position: absolute; left: -4%; right: -4%; top: 0; height: 16%;
    background: var(--cab-door); border-radius: .6cqw;
    transform-origin: left bottom; transition: transform .35s ease;
  }
  .furn.open .lid { transform: rotate(-105deg) translateY(-20%); }

  /* 상자 뚜껑 */
  .flap {
    position: absolute; top: 0; width: 50%; height: 22%;
    background: var(--cab-door); border: .3cqw solid rgba(0,0,0,.2);
    transition: transform .35s ease;
  }
  .flap.l { left: 0; transform-origin: left bottom; }
  .flap.r { right: 0; transform-origin: right bottom; }
  .furn.open .flap.l { transform: rotate(-125deg); }
  .furn.open .flap.r { transform: rotate(125deg); }

  /* 서랍 */
  .drawer-front {
    position: absolute; left: 0; right: 0; background: var(--cab-door);
    border: .35cqw solid rgba(0,0,0,.22); border-radius: .4cqw;
    transition: transform .35s ease;
  }
  .drawer-front .handle {
    position: absolute; left: 50%; top: 38%; width: 26%; height: 22%;
    transform: translateX(-50%); background: #d8d2c4; border-radius: .4cqw;
  }
  .furn.open .drawer-front { transform: translateY(46%) scale(1.04); }

  /* 테이블 / 카운터 / 선반 */
  .tabletop {
    position: absolute; left: 0; right: 0; top: 0; height: 22%;
    background: var(--wood); border-radius: 1cqw;
    box-shadow: 0 .4cqw 0 rgba(0,0,0,.25);
  }
  .leg { position: absolute; width: 8%; background: var(--wood); filter: brightness(.8); }
  .chair {
    position: absolute; background: var(--wood); border-radius: .5cqw;
    filter: brightness(.92); box-shadow: 0 .4cqw 0 rgba(0,0,0,.2);
  }
  .shelfboard {
    position: absolute; left: 0; right: 0; bottom: 0; height: 24%;
    background: var(--wood); border-radius: .4cqw; box-shadow: 0 .4cqw 0 rgba(0,0,0,.25);
  }
  .plant-pot { position: absolute; left: 15%; right: 15%; bottom: 0; height: 45%; background: #b5623c; border-radius: 0 0 1cqw 1cqw; }
  .plant-leaf { position: absolute; left: 0; right: 0; top: 0; height: 60%; display: grid; place-items: center; font-size: 5cqw; }
  .label {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: -2.6cqw;
    font-size: 2.1cqw; font-weight: 800; color: #fff;
    white-space: nowrap; pointer-events: none;
    text-shadow: 0 .2cqw .3cqw rgba(0,0,0,.85), 0 0 .6cqw rgba(0,0,0,.7);
  }

  /* --- 물건 --- */
  .obj {
    line-height: 1; cursor: pointer;
    filter: drop-shadow(0 .2cqw .2cqw rgba(0,0,0,.4));
    transition: transform .12s;
  }
  .obj.free { position: absolute; transform: translate(-50%,-50%) rotate(var(--rot)); }
  .obj.free:active { transform: translate(-50%,-50%) rotate(var(--rot)) scale(1.15); }
  .obj.slotted { position: relative; transform: rotate(var(--rot)); }
  .obj.slotted:active { transform: rotate(var(--rot)) scale(1.15); }
  .obj.gone { animation: found .45s forwards; pointer-events: none; }
  @keyframes found {
    0% { opacity: 1; }
    45% { transform: scale(1.9); filter: drop-shadow(0 0 1.5cqw #ffd479); opacity: 1; }
    100% { transform: scale(0); opacity: 0; }
  }
  .obj.hint { animation: hintRing 1.6s; }
  @keyframes hintRing {
    0%,100% { filter: drop-shadow(0 .2cqw .2cqw rgba(0,0,0,.4)); }
    50% { filter: drop-shadow(0 0 1.6cqw #ffd479) drop-shadow(0 0 2.6cqw #ffb020); }
  }

  .pop {
    position: absolute; transform: translate(-50%,-50%);
    font-weight: 900; font-size: 2.4cqw; pointer-events: none;
    animation: popUp .9s forwards; z-index: 90;
    text-shadow: 0 .2cqw 0 rgba(255,255,255,.9);
  }
  @keyframes popUp {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(.6); }
    25% { opacity: 1; transform: translate(-50%,-90%) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%,-170%) scale(1); }
  }

  .bubble {
    position: absolute; left: 50%; bottom: 3%; transform: translateX(-50%);
    background: rgba(255,255,255,.97); border: .5cqw solid var(--ink);
    border-radius: 2cqw; padding: 1.4cqw 2.2cqw;
    font-weight: 800; font-size: 2.1cqw; text-align: center;
    max-width: 80%; z-index: 95; pointer-events: none;
    box-shadow: 0 .5cqw 0 rgba(0,0,0,.25);
    animation: bubbleIn .3s;
  }
  @keyframes bubbleIn { from { opacity: 0; transform: translateX(-50%) translateY(1cqw); } }

  .scroll-hint {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    background: rgba(0,0,0,.6); color: #fff; font-weight: 800; font-size: 2.2cqw;
    padding: 1.2cqw 2.4cqw; border-radius: 999px; z-index: 96; pointer-events: none;
    animation: fadeOut 3.4s forwards;
  }
  @keyframes fadeOut { 0%,60% { opacity: 1; } 100% { opacity: 0; } }

  .playbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    background: #fff; border-top: 2px solid var(--line); flex: none;
  }

  /* ================= 오버레이 ================= */
  .overlay {
    position: absolute; inset: 0; z-index: 100; background: rgba(43,27,18,.75);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.on { display: flex; animation: fadeIn .25s; }
  @keyframes fadeIn { from { opacity: 0; } }
  .panel {
    background: var(--paper); border-radius: 26px; padding: 26px 22px;
    width: 100%; max-width: 380px; text-align: center;
    box-shadow: 0 10px 0 rgba(0,0,0,.25);
    animation: panelIn .3s cubic-bezier(.2,1.4,.5,1);
    max-height: 100%; overflow-y: auto;
  }
  @keyframes panelIn { from { transform: scale(.8); opacity: 0; } }
  .panel .big { font-size: 56px; line-height: 1; }
  .panel h2 { font-size: 25px; margin: 10px 0 6px; }
  .panel p { color: var(--ink-soft); font-size: 15px; line-height: 1.6; font-weight: 600; }
  .reward { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 16px 0 20px; }
  .reward .chip { font-size: 16px; padding: 9px 16px; }
  .panel-btns { display: flex; flex-direction: column; gap: 10px; }
  .levelup {
    background: linear-gradient(180deg,#fff6d9,#ffe9b0); border: 3px solid var(--gold);
    border-radius: 16px; padding: 10px; margin-bottom: 14px;
    font-weight: 900; color: #a97400; animation: pulse 1s infinite;
  }
  .help-list { text-align: left; font-size: 14px; line-height: 1.9; color: var(--ink-soft); font-weight: 600; margin: 14px 0 20px; }
  .help-list b { color: var(--ink); }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- ===== 타이틀 ===== -->
  <section id="screen-title" class="screen on">
    <div class="logo-emoji"><span>🍜</span><span>🔎</span><span>🍕</span></div>
    <h1>식당 대소동</h1>
    <div class="subtitle">사장님이 물건을 잃어버렸어요!<br>냉장고도 열어보고 서랍도 뒤져서 찾아주자</div>
    <button class="btn" id="btn-start" style="margin-top:10px">게임 시작 🎮</button>
    <button class="btn ghost" id="btn-help">어떻게 하는 거야?</button>
    <button class="btn ghost" id="btn-reset" style="font-size:13px;padding:8px 16px">기록 초기화</button>
    <div class="made-by">삼촌과 조카들이 함께 만든 게임 · v2.0</div>
  </section>

  <!-- ===== 식당 선택 ===== -->
  <section id="screen-map" class="screen">
    <div class="topbar">
      <button class="back-btn" id="btn-map-back">←</button>
      <div class="chip">⭐ 레벨 <span id="hud-level">1</span></div>
      <div class="spacer"></div>
      <div class="chip coin">🪙 <span id="hud-coin">0</span></div>
    </div>
    <div class="map-body">
      <div class="map-title">어느 식당으로 갈까?</div>
      <div class="map-desc">식당을 클리어하면 다음 가게가 열려요</div>
      <div id="rest-list"></div>
    </div>
  </section>

    if (!actx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
    if (actx && actx.state === "suspended") actx.resume();
    return actx;

  function tone(freq, start, dur, type, vol) {
    var ac = audio(); if (!ac) return;
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    var t = ac.currentTime + start;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol || .14, t + .01);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + .02);
  }

    scene.style.setProperty("--floor", c.floor);
    scene.style.setProperty("--cab", c.cab);
    scene.style.setProperty("--cab-door", c.cabDoor);
    scene.style.setProperty("--accent", c.accent);

    scene.appendChild(el("wall"));
    scene.appendChild(el("wainscot"));
    scene.appendChild(el("floor"));

    // 벽 장식
    var menu = el("deco menuboard", "left:41%;top:12%;width:13%;height:20%");
    menu.innerHTML = '<div class="mb-title">' + r.emoji + ' ' + r.name + '</div>' +
      r.menu.map(function (m) { return '<div class="mb-row">' + m + '</div>'; }).join("");
    scene.appendChild(menu);

    var win = el("deco window", "left:72%;top:12%;width:13%;height:22%");
    scene.appendChild(win);

    var pic = el("deco picture", "left:30%;top:34%;width:7%;height:11%");
    pic.textContent = r.wallProps[0];
    scene.appendChild(pic);

    var clk = el("deco clock", "left:86%;top:12%;width:6%;height:11%");
    clk.textContent = r.wallProps[1];
    scene.appendChild(clk);

    // 자리를 난이도에 맞게 고릅니다.
    // 레벨이 올라갈수록 '열어봐야 하는 곳'에 목표를 넣습니다.
    var slots = [];
    LAYOUT.forEach(function (f) {
      var built = buildFurniture(f);
      scene.appendChild(built.node);
      for (var i = 0; i < f.cap; i++) slots.push({ f: f, host: built.host, node: built.node });
    });

    var inSlots    = shuffle(slots.filter(function (s) { return s.f.kind === "in"; }));
    var openSlots  = shuffle(slots.filter(function (s) { return s.f.kind !== "in"; }));

    // 레벨 1은 절반만 가구 안에, 마지막 레벨은 전부 가구 안에 숨깁니다
    var hideRatio = [0.4, 0.6, 0.8, 1, 1][levelIdx] || 1;
    var chosen = [];
    r.targets.forEach(function (t, i) {
      var useIn = (i / r.targets.length) < hideRatio;
      var pool = useIn ? inSlots : openSlots;
      if (!pool.length) pool = useIn ? openSlots : inSlots;
      var s = pool.shift();
      chosen.push({ slot: s, item: t });
    });

    // 목표 배치
    chosen.forEach(function (ch) {
      ch.slot.host.appendChild(makeObj(ch.item.emoji, ch.item.name));
    });

    // 남은 자리는 방해물로 채웁니다
    var decoys = r.decoys.filter(function (d) {
      return !r.targets.some(function (t) { return t.emoji === d; });
    });
    shuffle(inSlots.concat(openSlots)).forEach(function (s) {
      // 자리를 전부 채우지 않고 조금 비워둬야 자연스럽습니다
      if (Math.random() < 0.12) return;
      s.host.appendChild(makeObj(pick(decoys), ""));
    });

    stage.appendChild(scene);

    // 가구 열기
    scene.addEventListener("click", onTapFurniture);

    var hint = el("scroll-hint");
    hint.textContent = "← 옆으로 밀어서 가게를 둘러보세요 →";
    stage.appendChild(hint);
    setTimeout(function () { if (hint.parentNode) hint.remove(); }, 3500);
  }

  /* ============================================================
     7. 조작
     ============================================================ */
  var dragged = false;

  function onTapFurniture(e) {
    if (!running || dragged) return;
    if (e.target.closest(".obj")) return;         // 물건을 누른 건 따로 처리
    var f = e.target.closest(".furn.can-open");
    if (!f) return;
    f.classList.toggle("open");
    if (f.classList.contains("open")) sfx.open();
  }

  function onTapObject(e) {
    if (!running || dragged) return;
    e.stopPropagation();
    var o = e.currentTarget;
    var emoji = o.dataset.target;

    if (emoji && remain.indexOf(emoji) !== -1) {
      remain.splice(remain.indexOf(emoji), 1);
      o.classList.add("gone");
      sfx.find();
      popAt(o, "+" + COIN_PER_FIND + " 🪙", "#a97400");
      save.coin += COIN_PER_FIND;
      refreshHud();
      var chip = $("find-list").querySelector('[data-emoji="' + emoji + '"]');
      if (chip) chip.classList.add("found");

      if (remain.length === 0) finish(true);
      else say(cur.bossName + ": " + o.dataset.name + " 찾았다! " + remain.length + "개 남았어!", 1800);
    } else {
      sfx.wrong();
      timeLeft = Math.max(0, timeLeft - WRONG_PENALTY);
      updateTimer();
      popAt(o, "-" + WRONG_PENALTY + "초", "#e04b4b");
      var st = $("stage");
      st.classList.remove("shake"); void st.offsetWidth; st.classList.add("shake");
      if (timeLeft <= 0) finish(false);
    }
  }

  // 물건 위치에 점수를 띄웁니다 (물건이 가구 안에 있어도 정확히 그 자리에)
  function popAt(o, text, color) {
    var stage = $("stage"), scene = stage.querySelector(".scene");
    if (!scene) return;
    var a = o.getBoundingClientRect(), b = scene.getBoundingClientRect();
    var p = el("pop");
    p.textContent = text;
    p.style.color = color;
    p.style.left = ((a.left + a.width / 2 - b.left) / b.width * 100) + "%";
    p.style.top = ((a.top + a.height / 2 - b.top) / b.height * 100) + "%";
    scene.appendChild(p);
    setTimeout(function () { if (p.parentNode) p.remove(); }, 950);
  }

  function say(text, ms) {
    var stage = $("stage"), scene = stage.querySelector(".scene");
    if (!scene) return;
    var old = scene.querySelector(".bubble");
    if (old) old.remove();
    var b = el("bubble");
    b.textContent = text;
    // 말풍선은 지금 보고 있는 화면 한가운데에 띄웁니다
    b.style.left = ((stage.scrollLeft + stage.clientWidth / 2) / scene.offsetWidth * 100) + "%";
    scene.appendChild(b);
    setTimeout(function () { if (b.parentNode) b.remove(); }, ms || 2600);
  }

  // 드래그로 가게 안을 둘러보기 (마우스). 터치는 브라우저 기본 스크롤을 씁니다.
  (function enableDrag() {
    var stage = $("stage"), down = false, sx = 0, sl = 0;
    stage.addEventListener("pointerdown", function (e) {
      if (e.pointerType === "touch") return;
      down = true; dragged = false;
      sx = e.clientX; sl = stage.scrollLeft;
      stage.classList.add("dragging");
    });
    stage.addEventListener("pointermove", function (e) {
      if (!down) return;
      var dx = e.clientX - sx;
      if (Math.abs(dx) > 6) dragged = true;
      stage.scrollLeft = sl - dx;
    });
    function up() {
      down = false;
      stage.classList.remove("dragging");
      setTimeout(function () { dragged = false; }, 0);
    }
    stage.addEventListener("pointerup", up);
    stage.addEventListener("pointercancel", up);
    stage.addEventListener("pointerleave", up);
  })();

  /* ============================================================
     8. 진행
     ============================================================ */
  function buildFindList() {
    var b = $("find-list");
    b.innerHTML = "";
    cur.targets.forEach(function (t) {
      var d = el("find-item");
      d.dataset.emoji = t.emoji;
      d.innerHTML = '<div class="fi-emoji">' + t.emoji + '</div><div class="fi-name">' + t.name + '</div>';
      b.appendChild(d);
    });
  }

  // 초를 1:30 처럼 보여줍니다
  function mmss(sec) {
    return Math.floor(sec / 60) + ":" + ("0" + (sec % 60)).slice(-2);
  }
  // 식당 목록에는 "2분", "1분 30초" 처럼 읽기 쉽게 씁니다
  function timeWords(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    if (m && s) return m + "분 " + s + "초";
    if (m) return m + "분";
    return s + "초";
  }

  function updateTimer() {
    var t = $("hud-timer");
    t.textContent = "⏱ " + mmss(timeLeft);
    t.classList.toggle("low", timeLeft <= 10);
  }

  function startLevel(i) {
    curIndex = i; cur = RESTAURANTS[i];
    remain = cur.targets.map(function (t) { return t.emoji; });
    timeLeft = cur.time;

    $("hud-restname").textContent = cur.emoji + " " + cur.name;
    $("hud-boss").textContent = cur.boss;
    $("btn-hint").textContent = "💡 힌트 (🪙" + HINT_COST + ")";

    buildFindList();
    drawScene(cur, i);
    refreshHud();
    updateTimer();
    show("screen-play");
    say(cur.bossName + ": " + cur.quest, 3600);

    running = true;
    clearInterval(timerId);
    timerId = setInterval(function () {
      if (!running) return;
      timeLeft--; updateTimer();
      if (timeLeft <= 0) finish(false);
    }, 1000);
  }

  function finish(win) {
    running = false;
    clearInterval(timerId);

    if (win) {
      sfx.clear();
      var bonus = CLEAR_BONUS + timeLeft * TIME_BONUS;
      save.coin += bonus;
      var up = !isCleared(cur.id);
      if (up) save.cleared.push(cur.id);
      writeSave(); refreshHud();
      var next = RESTAURANTS[curIndex + 1];
      openPanel(
        '<div class="big">' + cur.boss + '</div><h2>사장님이 칭찬했어요!</h2>' +
        '<p>"' + cur.praise + '"</p>' +
        (up ? '<div class="levelup">⭐ 레벨 ' + level() + ' 달성!' +
          (next ? '<br>' + next.emoji + ' ' + next.name + ' 이(가) 열렸어요!' : '<br>모든 식당을 클리어했어요! 🏆') + '</div>' : '') +
        '<div class="reward"><span class="chip coin">🪙 +' + bonus + '</span>' +
        '<span class="chip timer">⏱ ' + timeWords(timeLeft) + ' 남음</span></div>' +
        '<div class="panel-btns">' +
        (next ? '<button class="btn" data-act="next">' + next.emoji + ' ' + next.name + ' 가기</button>' : '') +
        '<button class="btn ghost" data-act="map">식당 목록으로</button></div>'
      );
    } else {
      sfx.fail();
      openPanel(
        '<div class="big">⏰</div><h2>시간 초과!</h2>' +
        '<p>' + (cur.targets.length - remain.length) + ' / ' + cur.targets.length +
        '개 찾았어요.<br>냉장고랑 서랍도 열어봤어?</p>' +
        '<div class="panel-btns" style="margin-top:18px">' +
        '<button class="btn" data-act="retry">🔄 다시 도전</button>' +
        '<button class="btn ghost" data-act="map">식당 목록으로</button></div>'
      );
    }
  }

  function openPanel(html) { $("panel").innerHTML = html; $("overlay").classList.add("on"); }
  function closePanel() { $("overlay").classList.remove("on"); }

  $("overlay").addEventListener("click", function (e) {
    var act = e.target.dataset ? e.target.dataset.act : null;
    if (!act) return;
    sfx.tap(); closePanel();
    if (act === "next") startLevel(curIndex + 1);
    else if (act === "retry") startLevel(curIndex);
    else if (act === "map") { buildMap(); refreshHud(); show("screen-map"); }
    else if (act === "dowipe") { save = { coin: 0, cleared: [] }; writeSave(); refreshHud(); buildMap(); }
  });

  /* ============================================================
     9. 버튼
     ============================================================ */
  $("btn-start").addEventListener("click", function () {
    audio(); sfx.tap(); buildMap(); refreshHud(); show("screen-map");
  });

  $("btn-help").addEventListener("click", function () {
    audio(); sfx.tap();
    openPanel(
      '<div class="big">🔎</div><h2>이렇게 하면 돼!</h2>' +
      '<div class="help-list">' +
      '1. 가게를 <b>옆으로 밀어서</b> 주방부터 홀까지 둘러봐요<br>' +
      '2. <b>냉장고 · 찬장 · 서랍 · 상자 · 쓰레기통</b>은 눌러서 열 수 있어요<br>' +
      '3. 열었을 때 <b>찾는 물건이 있으면 눌러서 획득!</b> 코인 ' + COIN_PER_FIND + '개<br>' +
      '4. 테이블 위, 테이블 밑, 화분 뒤도 잘 보세요<br>' +
      '5. 엉뚱한 걸 누르면 <b>시간이 ' + WRONG_PENALTY + '초 줄어요</b><br>' +
      '6. 다 찾으면 <b>레벨업</b>하고 새 식당이 열려요' +
      '</div><div class="panel-btns"><button class="btn" data-act="close">알겠어!</button></div>'
    );
  });

  $("btn-reset").addEventListener("click", function () {
    sfx.tap();
    openPanel(
      '<div class="big">🗑️</div><h2>기록을 지울까요?</h2>' +
      '<p>코인과 클리어한 식당이 모두 사라져요.</p>' +
      '<div class="panel-btns" style="margin-top:18px">' +
      '<button class="btn ghost" data-act="dowipe">네, 지울래요</button>' +
      '<button class="btn" data-act="close">아니요</button></div>'
    );
  });

  $("btn-map-back").addEventListener("click", function () { sfx.tap(); show("screen-title"); });
  $("btn-play-back").addEventListener("click", function () {
    running = false; clearInterval(timerId); sfx.tap();
    buildMap(); refreshHud(); show("screen-map");
  });
  $("btn-retry").addEventListener("click", function () { sfx.tap(); startLevel(curIndex); });

  $("btn-hint").addEventListener("click", function () {
    if (!running || !remain.length) return;
    if (save.coin < HINT_COST) { sfx.wrong(); say("코인이 부족해요! (🪙" + HINT_COST + " 필요)", 1800); return; }
    save.coin -= HINT_COST; refreshHud(); writeSave(); sfx.tap();

    var emoji = remain[0];
    var stage = $("stage");
    var o = stage.querySelector('.obj[data-target="' + emoji + '"]:not(.gone)');
    if (o) {
      var furn = o.closest(".furn");
      var where = furn ? (LAYOUT.filter(function (f) { return f.id === furn.dataset.fid; })[0] || {}).name : null;
      // 그 가구가 보이도록 화면을 옮겨줍니다
      if (furn) {
        var scene = stage.querySelector(".scene");
        var fx = furn.offsetLeft + furn.offsetWidth / 2;
        stage.scrollTo({ left: Math.max(0, fx - stage.clientWidth / 2), behavior: "smooth" });
      }
      o.classList.remove("hint"); void o.offsetWidth; o.classList.add("hint");
      setTimeout(function () { say(where ? where + " 쪽을 잘 봐!" : "이 근처에 있어!", 2400); }, 300);
    }
    var chip = $("find-list").querySelector('[data-emoji="' + emoji + '"]');
    if (chip) { chip.classList.remove("hinting"); void chip.offsetWidth; chip.classList.add("hinting"); }
  });

  loadSave();
  refreshHud();
})();
</script>
</body>
</html>
