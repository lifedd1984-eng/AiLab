<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>식당 대소동 - 사장님 물건 찾기</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #3b2410;
    --ink-soft: #7a5c3e;
    --paper: #fff8ec;
    --line: #e6d3b3;
    --brand: #ff7043;
    --brand-dark: #e2542a;
    --gold: #f5b301;
    --ok: #2fa36b;
    --bad: #e04b4b;
    --shadow: 0 4px 0 rgba(0,0,0,.16);
  }

  html, body {
    height: 100%;
    background: #2b1b12;
    color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }

  body {
    display: flex;
    justify-content: center;
    overscroll-behavior: none;
  }

  #app {
    width: 100%;
    max-width: 920px;
    min-height: 100%;
    background: var(--paper);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  .screen { display: none; flex-direction: column; flex: 1; min-height: 0; }
  .screen.on { display: flex; }

  button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }

  .btn {
    background: var(--brand);
    color: #fff;
    font-weight: 800;
    padding: 14px 26px;
    border-radius: 999px;
    box-shadow: 0 4px 0 var(--brand-dark);
    transition: transform .08s, box-shadow .08s;
    font-size: 17px;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--brand-dark); }
  .btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 3px 0 var(--line); border: 2px solid var(--line); }
  .btn.ghost:active { box-shadow: 0 0 0 var(--line); }

  /* ---------- 타이틀 ---------- */
  #screen-title {
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 40px 24px;
    text-align: center;
    background:
      radial-gradient(circle at 20% 15%, #ffe2b8 0, transparent 45%),
      radial-gradient(circle at 85% 80%, #ffd9cc 0, transparent 45%),
      var(--paper);
  }
  .logo-emoji { font-size: 76px; line-height: 1; filter: drop-shadow(0 6px 0 rgba(0,0,0,.1)); }
  .logo-emoji span { display: inline-block; animation: bob 2.2s ease-in-out infinite; }
  .logo-emoji span:nth-child(2) { animation-delay: .3s; }
  .logo-emoji span:nth-child(3) { animation-delay: .6s; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-12px) rotate(3deg); } }

  h1 { font-size: 38px; letter-spacing: -1px; }
  .subtitle { color: var(--ink-soft); font-size: 16px; font-weight: 600; line-height: 1.6; }
  .made-by { margin-top: 8px; font-size: 13px; color: var(--ink-soft); opacity: .8; }

  /* ---------- 공통 상단바 ---------- */
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    background: #fff;
    border-bottom: 2px solid var(--line);
    flex: none;
  }
  .topbar .spacer { flex: 1; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--paper); border: 2px solid var(--line);
    border-radius: 999px; padding: 6px 13px;
    font-weight: 800; font-size: 15px; white-space: nowrap;
  }
  .chip.coin { border-color: #f7dd9a; background: #fff7e0; color: #a97400; }
  .chip.timer { border-color: #cfe6d8; background: #eefaf3; color: #1f7a4f; font-variant-numeric: tabular-nums; }
  .chip.timer.low { border-color: #f3c3c3; background: #fdeeee; color: var(--bad); animation: pulse .6s infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  .back-btn { font-size: 22px; padding: 4px 8px; line-height: 1; }

  /* ---------- 식당 선택 ---------- */
  #screen-map .map-body { flex: 1; overflow-y: auto; padding: 16px 14px 32px; }
  .map-title { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
  .map-desc { font-size: 14px; color: var(--ink-soft); margin-bottom: 16px; }

  .rest-card {
    display: flex; align-items: center; gap: 14px;
    width: 100%; text-align: left;
    background: #fff; border: 3px solid var(--line);
    border-radius: 20px; padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 4px 0 var(--line);
    transition: transform .08s, box-shadow .08s;
  }
  .rest-card:not(.locked):active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .rest-card.locked { opacity: .55; filter: grayscale(.7); cursor: not-allowed; }
  .rest-card.cleared { border-color: #b7e3ca; box-shadow: 0 4px 0 #b7e3ca; }
  .rest-emoji { font-size: 40px; flex: none; width: 56px; text-align: center; }
  .rest-info { flex: 1; min-width: 0; }
  .rest-name { font-size: 18px; font-weight: 800; }
  .rest-meta { font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
  .badge {
    font-size: 12px; font-weight: 800; padding: 3px 9px;
    border-radius: 999px; background: var(--line); color: var(--ink);
  }
  .badge.d1 { background: #dff3e6; color: #1f7a4f; }
  .badge.d2 { background: #fff2cf; color: #a97400; }
  .badge.d3 { background: #ffe0d6; color: #c0472a; }
  .badge.d4 { background: #eadcff; color: #6b3fbf; }
  .badge.d5 { background: #ffd9e6; color: #b02f61; }
  .rest-right { flex: none; font-size: 22px; }

  /* ---------- 플레이 ---------- */
  #screen-play { background: #fff; }

  .quest {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: #fff;
    border-bottom: 2px solid var(--line);
    flex: none;
  }
  .boss-face {
    font-size: 30px; flex: none;
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--paper); border: 2px solid var(--line);
    display: grid; place-items: center;
  }
  .find-list { display: flex; gap: 8px; overflow-x: auto; flex: 1; padding-bottom: 2px; }
  .find-list::-webkit-scrollbar { height: 0; }
  .find-item {
    flex: none; display: flex; flex-direction: column; align-items: center; gap: 1px;
    background: var(--paper); border: 2px solid var(--line);
    border-radius: 14px; padding: 5px 10px 4px; min-width: 62px;
    transition: all .2s;
  }
  .find-item .fi-emoji { font-size: 24px; line-height: 1.1; }
  .find-item .fi-name { font-size: 11px; font-weight: 700; color: var(--ink-soft); white-space: nowrap; }
  .find-item.found { background: #eefaf3; border-color: #a9dcc2; }
  .find-item.found .fi-emoji { filter: grayscale(1); opacity: .45; }
  .find-item.found .fi-name { text-decoration: line-through; color: #2fa36b; }
  .find-item.hinting { animation: hintPop .5s ease-in-out 3; }
  @keyframes hintPop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); background: #fff2cf; } }

  .stage-wrap { flex: 1; min-height: 0; display: grid; place-items: center; padding: 8px; background: #f3e7d3; }
  .stage {
    position: relative;
    width: 100%;
    max-width: 880px;
    aspect-ratio: 3 / 4;
    max-height: 100%;
    border-radius: 16px;
    overflow: hidden;
    container-type: inline-size;
    box-shadow: inset 0 0 0 3px rgba(0,0,0,.08), 0 6px 14px rgba(0,0,0,.15);
    touch-action: manipulation;
    user-select: none;
  }
  @media (min-width: 700px) and (orientation: landscape) {
    .stage { aspect-ratio: 4 / 3; }
  }
  .stage.shake { animation: shake .3s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-7px); }
    75% { transform: translateX(7px); }
  }

  .floor { position: absolute; left: 0; right: 0; bottom: 0; }
  .furn { position: absolute; }

  .obj {
    position: absolute;
    transform: translate(-50%, -50%) rotate(var(--rot));
    line-height: 1;
    cursor: pointer;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.25));
    transition: transform .12s;
  }
  .obj:active { transform: translate(-50%, -50%) rotate(var(--rot)) scale(1.12); }
  .obj.gone { animation: found .45s forwards; pointer-events: none; }
  @keyframes found {
    0% { transform: translate(-50%,-50%) rotate(var(--rot)) scale(1); }
    45% { transform: translate(-50%,-50%) rotate(0deg) scale(1.9); filter: drop-shadow(0 0 14px #ffd479); }
    100% { transform: translate(-50%,-50%) scale(0); opacity: 0; }
  }
  .obj.hint { animation: hintRing 1.5s; }
  @keyframes hintRing {
    0%,100% { filter: drop-shadow(0 1px 1px rgba(0,0,0,.25)); }
    50% { filter: drop-shadow(0 0 16px #ffd479) drop-shadow(0 0 26px #ffb020); }
  }

  .pop {
    position: absolute; transform: translate(-50%, -50%);
    font-weight: 900; font-size: 20px; pointer-events: none;
    animation: popUp .9s forwards; z-index: 60;
    text-shadow: 0 2px 0 rgba(255,255,255,.9);
  }
  @keyframes popUp {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(.6); }
    25% { opacity: 1; transform: translate(-50%,-90%) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%,-170%) scale(1); }
  }

  .bubble {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
    background: rgba(255,255,255,.96); border: 3px solid var(--ink);
    border-radius: 18px; padding: 10px 16px;
    font-weight: 800; font-size: 15px; text-align: center;
    max-width: 88%; z-index: 55;
    pointer-events: none; /* 말풍선 아래에 있는 물건도 누를 수 있어야 합니다 */
    box-shadow: 0 4px 0 rgba(0,0,0,.2);
    animation: bubbleIn .3s;
  }
  @keyframes bubbleIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } }

  .playbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    background: #fff; border-top: 2px solid var(--line); flex: none;
  }

  /* ---------- 결과 오버레이 ---------- */
  .overlay {
    position: absolute; inset: 0; z-index: 100;
    background: rgba(43,27,18,.72);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.on { display: flex; animation: fadeIn .25s; }
  @keyframes fadeIn { from { opacity: 0; } }
  .panel {
    background: var(--paper); border-radius: 26px; padding: 26px 22px;
    width: 100%; max-width: 380px; text-align: center;
    box-shadow: 0 10px 0 rgba(0,0,0,.25);
    animation: panelIn .3s cubic-bezier(.2,1.4,.5,1);
  }
  @keyframes panelIn { from { transform: scale(.8); opacity: 0; } }
  .panel .big { font-size: 60px; line-height: 1; }
  .panel h2 { font-size: 26px; margin: 10px 0 6px; }
  .panel p { color: var(--ink-soft); font-size: 15px; line-height: 1.6; font-weight: 600; }
  .reward {
    display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;
    margin: 16px 0 20px;
  }
  .reward .chip { font-size: 16px; padding: 9px 16px; }
  .panel-btns { display: flex; flex-direction: column; gap: 10px; }

  .levelup {
    background: linear-gradient(180deg, #fff6d9, #ffe9b0);
    border: 3px solid var(--gold);
    border-radius: 16px; padding: 10px; margin-bottom: 14px;
    font-weight: 900; color: #a97400;
    animation: pulse 1s infinite;
  }

  .help-list { text-align: left; font-size: 14px; line-height: 1.9; color: var(--ink-soft); font-weight: 600; margin: 14px 0 20px; }
  .help-list b { color: var(--ink); }
</style>
</head>
<body>
<div id="app">

  <!-- ===== 타이틀 ===== -->
  <section id="screen-title" class="screen on">
    <div class="logo-emoji"><span>🍜</span><span>🔎</span><span>🍕</span></div>
    <h1>식당 대소동</h1>
    <div class="subtitle">사장님이 물건을 잃어버렸어요!<br>가게 안을 뒤져서 찾아주고 코인을 받자</div>
    <button class="btn" id="btn-start" style="margin-top:10px">게임 시작 🎮</button>
    <button class="btn ghost" id="btn-help">어떻게 하는 거야?</button>
    <button class="btn ghost" id="btn-reset" style="font-size:13px;padding:8px 16px">기록 초기화</button>
    <div class="made-by">삼촌과 조카들이 함께 만든 게임 · v1.0</div>
  </section>

  <!-- ===== 식당 선택 ===== -->
  <section id="screen-map" class="screen">
    <div class="topbar">
      <button class="back-btn" id="btn-map-back">←</button>
      <div class="chip">⭐ 레벨 <span id="hud-level">1</span></div>
      <div class="spacer"></div>
      <div class="chip coin">🪙 <span id="hud-coin">0</span></div>
    </div>
    <div class="map-body">
      <div class="map-title">어느 식당으로 갈까?</div>
      <div class="map-desc">식당을 클리어하면 다음 가게가 열려요</div>
      <div id="rest-list"></div>
    </div>
  </section>

  <!-- ===== 플레이 ===== -->
  <section id="screen-play" class="screen">
    <div class="topbar">
      <button class="back-btn" id="btn-play-back">←</button>
      <div class="chip" id="hud-restname">식당</div>
      <div class="spacer"></div>
      <div class="chip timer" id="hud-timer">⏱ 60</div>
      <div class="chip coin">🪙 <span id="hud-coin2">0</span></div>
    </div>

    <div class="quest">
      <div class="boss-face" id="hud-boss">👩‍🍳</div>
      <div class="find-list" id="find-list"></div>
    </div>

    <div class="stage-wrap">
      <div class="stage" id="stage"></div>
    </div>

    <div class="playbar">
      <button class="btn ghost" id="btn-hint">💡 힌트 (🪙30)</button>
      <div class="spacer" style="flex:1"></div>
      <button class="btn ghost" id="btn-retry">🔄 다시</button>
    </div>
  </section>

  <!-- ===== 오버레이 ===== -->
  <div class="overlay" id="overlay">
    <div class="panel" id="panel"></div>
  </div>

</div>

        { emoji: "🧑", name: "사람" }
      ],
      // 마지막 판이라 헷갈리는 것들을 전부 쏟아붓습니다
      decoys: ["1️⃣","2️⃣","3️⃣","4️⃣","5️⃣","6️⃣","8️⃣","9️⃣","🔢","🎴","🧒","👦","👧","🧓","👵","🧔","📷","📹","🎥","🍗","🥩","🌭","🍔","🍟","🎂","🍰","🍩","🍪","🧁","🍫","🍬","🍭","🥧","🍦","🎈","🎉","🎊","🍇","🍓","🍉","🥗","🧀","🥨","🍿","🎁","👕","📱","🍽️"],
      clutter: 70
    }
  ];

  var COIN_PER_FIND = 10;   // 물건 하나 찾을 때 코인
  var CLEAR_BONUS   = 50;   // 클리어 보너스
  var TIME_BONUS    = 2;    // 남은 1초당 코인
  var HINT_COST     = 30;   // 힌트 가격
  var WRONG_PENALTY = 3;    // 헛다리 짚으면 깎이는 시간(초)

  /* ============================================================
     저장 (localStorage)
     ============================================================ */
  var SAVE_KEY = "sikdang-daesodong-v1";
  var save = { coin: 0, cleared: [] };

  function loadSave() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (d && typeof d.coin === "number" && Array.isArray(d.cleared)) save = d;
    } catch (e) { /* 저장 안 되는 환경이면 그냥 새 게임 */ }
  }
  function writeSave() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
  }
  function level() { return save.cleared.length + 1; }
  function isUnlocked(i) { return i === 0 || save.cleared.indexOf(RESTAURANTS[i - 1].id) !== -1; }
  function isCleared(id) { return save.cleared.indexOf(id) !== -1; }

  /* ============================================================
     소리 (파일 없이 WebAudio로 직접 만듭니다)
     ============================================================ */
  var actx = null;
  function audio() {
    if (!actx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    }
    if (actx && actx.state === "suspended") actx.resume();
    return actx;
  }
  function tone(freq, start, dur, type, vol) {
    var ac = audio();
    if (!ac) return;
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type || "sine";
    o.frequency.value = freq;
    var t = ac.currentTime + start;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol || 0.14, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  var sfx = {
    find:  function () { tone(660, 0, .12, "triangle", .16); tone(990, .08, .18, "triangle", .14); },
    wrong: function () { tone(160, 0, .18, "sawtooth", .10); },
    clear: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * .11, .32, "triangle", .15); }); },
    fail:  function () { [392, 330, 262].forEach(function (f, i) { tone(f, i * .14, .3, "sine", .13); }); },
    tap:   function () { tone(440, 0, .07, "square", .07); }
  };

  /* ============================================================
     화면 전환
     ============================================================ */
  var $ = function (id) { return document.getElementById(id); };
  function show(id) {
    var list = document.querySelectorAll(".screen");
    for (var i = 0; i < list.length; i++) list[i].classList.remove("on");
    $(id).classList.add("on");
  }
  function refreshHud() {
    $("hud-coin").textContent = save.coin;
    $("hud-coin2").textContent = save.coin;
    $("hud-level").textContent = level();
  }

  /* ============================================================
     식당 목록
     ============================================================ */
  function buildMap() {
    var box = $("rest-list");
    box.innerHTML = "";
    RESTAURANTS.forEach(function (r, i) {
      var unlocked = isUnlocked(i), cleared = isCleared(r.id);
      var card = document.createElement("button");
      card.className = "rest-card" + (unlocked ? "" : " locked") + (cleared ? " cleared" : "");
      card.innerHTML =
        '<div class="rest-emoji">' + (unlocked ? r.emoji : "🔒") + '</div>' +
        '<div class="rest-info">' +
          '<div class="rest-name">' + r.name + (cleared ? " ✅" : "") + '</div>' +
          '<div class="rest-meta">' +
            '<span class="badge ' + r.diffClass + '">' + r.diff + '</span> ' +
            '찾을 물건 ' + r.targets.length + '개 · ' + r.time + '초' +
          '</div>' +
        '</div>' +
        '<div class="rest-right">' + (unlocked ? "▶" : "") + '</div>';
      if (unlocked) {
        card.addEventListener("click", function () { sfx.tap(); startLevel(i); });
      } else {
        card.addEventListener("click", function () {
          card.animate(
            [{ transform: "translateX(0)" }, { transform: "translateX(-6px)" },
             { transform: "translateX(6px)" }, { transform: "translateX(0)" }],
            { duration: 250 }
          );
        });
      }
      box.appendChild(card);
    });
  }

  /* ============================================================
     플레이
     ============================================================ */
  var cur = null;      // 현재 식당 데이터
  var curIndex = 0;
  var remain = [];     // 아직 못 찾은 목표
  var timeLeft = 0;
  var timerId = null;
  var running = false;

  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  // 이미 놓인 물건들과 가장 가까운 거리
  function nearest(spots, x, y) {
    var min = Infinity;
    for (var i = 0; i < spots.length; i++) {
      var dx = spots[i].x - x, dy = spots[i].y - y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < min) min = d;
    }
    return min;
  }

  // 물건이 서로 너무 겹치지 않게 자리를 잡아줍니다.
  // 자리가 빡빡해도 '가장 덜 붐비는 곳'을 골라주기 때문에 물건이 완전히 포개지지 않습니다.
  function scatter(count, minDist, placed) {
    var spots = placed ? placed.slice() : [];
    var startAt = spots.length;
    for (var i = 0; i < count; i++) {
      var best = null, bestD = -1, guard = 0;
      while (guard++ < 60) {
        var x = rand(6, 94), y = rand(7, 92);
        var d = nearest(spots, x, y);
        if (d >= minDist) { best = { x: x, y: y }; break; }
        if (d > bestD) { bestD = d; best = { x: x, y: y }; }
      }
      spots.push(best);
    }
    return spots.slice(startAt);
  }

  function drawScene(r) {
    var stage = $("stage");
    stage.innerHTML = "";
    stage.style.background = "linear-gradient(180deg," + r.wall + " 0%," + r.wall2 + " 100%)";

    // 바닥
    var floor = document.createElement("div");
    floor.className = "floor";
    floor.style.height = "26%";
    floor.style.background = r.floor;
    floor.style.opacity = ".85";
    stage.appendChild(floor);

    // 가구 (탁자, 선반, 카운터) — 물건이 살짝 가려지게 해서 찾는 맛을 냅니다
    var furns = [
      { x: 4, y: 30, w: 40, h: 4, c: "rgba(0,0,0,.20)", r: 3 },
      { x: 56, y: 46, w: 40, h: 4, c: "rgba(0,0,0,.20)", r: 3 },
      { x: 10, y: 62, w: 34, h: 12, c: "rgba(0,0,0,.16)", r: 8 },
      { x: 58, y: 72, w: 36, h: 14, c: "rgba(0,0,0,.16)", r: 8 },
      { x: 0, y: 86, w: 100, h: 10, c: "rgba(0,0,0,.13)", r: 0 }
    ];
    furns.forEach(function (f) {
      var d = document.createElement("div");
      d.className = "furn";
      d.style.left = f.x + "%"; d.style.top = f.y + "%";
      d.style.width = f.w + "%"; d.style.height = f.h + "%";
      d.style.background = f.c;
      d.style.borderRadius = f.r + "px";
      d.style.zIndex = 20;
      stage.appendChild(d);
    });

    // 목표 + 방해물 배치
    var decoys = r.decoys.filter(function (d) {
      return !r.targets.some(function (t) { return t.emoji === d; });
    });

    // 1) 목표부터 넉넉한 간격으로 배치 — 서로 뭉쳐 있으면 너무 쉬워집니다
    var targetSpots = scatter(r.targets.length, 22);

    // 2) 방해물은 남은 자리에 촘촘히. 물건이 많을수록 간격을 좁힙니다
    var gap = Math.max(5, 12 - r.clutter * 0.1);
    var decoySpots = scatter(r.clutter, gap, targetSpots);

    function put(emoji, name, spot, z) {
      var el = document.createElement("div");
      el.className = "obj";
      el.textContent = emoji;
      el.style.left = spot.x + "%";
      el.style.top = spot.y + "%";
      el.style.fontSize = rand(3.4, 5.4).toFixed(2) + "cqw";
      el.style.setProperty("--rot", rand(-35, 35).toFixed(0) + "deg");
      el.style.zIndex = z;
      if (name) { el.dataset.target = emoji; el.dataset.name = name; }
      el.addEventListener("click", onTap);
      stage.appendChild(el);
    }

    // 방해물은 일부를 가구 뒤(z 10)로 보내 깊이감을 줍니다
    decoySpots.forEach(function (s, i) {
      put(pick(decoys), "", s, Math.random() < 0.35 ? 10 : 30);
    });

    // 목표는 항상 맨 위(z 35)에 둡니다.
    // 안 그러면 방해물에 완전히 덮여서 누를 수 없는 물건이 생깁니다.
    r.targets.forEach(function (t, i) {
      put(t.emoji, t.name, targetSpots[i], 35);
    });
  }

  function buildFindList() {
    var box = $("find-list");
    box.innerHTML = "";
    cur.targets.forEach(function (t) {
      var d = document.createElement("div");
      d.className = "find-item";
      d.dataset.emoji = t.emoji;
      d.innerHTML = '<div class="fi-emoji">' + t.emoji + '</div><div class="fi-name">' + t.name + '</div>';
      box.appendChild(d);
    });
  }

  function say(text, ms) {
    var stage = $("stage");
    var old = stage.querySelector(".bubble");
    if (old) old.remove();
    var b = document.createElement("div");
    b.className = "bubble";
    b.textContent = text;
    stage.appendChild(b);
    setTimeout(function () { if (b.parentNode) b.remove(); }, ms || 2600);
  }

  function popText(el, text, color) {
    var stage = $("stage");
    var p = document.createElement("div");
    p.className = "pop";
    p.textContent = text;
    p.style.color = color;
    p.style.left = el.style.left;
    p.style.top = el.style.top;
    stage.appendChild(p);
    setTimeout(function () { if (p.parentNode) p.remove(); }, 950);
  }

  function onTap(e) {
    if (!running) return;
    var el = e.currentTarget;
    var emoji = el.dataset.target;

    if (emoji && remain.indexOf(emoji) !== -1) {
      // 찾았다!
      remain.splice(remain.indexOf(emoji), 1);
      el.classList.add("gone");
      sfx.find();
      popText(el, "+" + COIN_PER_FIND + " 🪙", "#a97400");
      save.coin += COIN_PER_FIND;
      refreshHud();

      var chip = $("find-list").querySelector('[data-emoji="' + emoji + '"]');
      if (chip) chip.classList.add("found");

      if (remain.length === 0) {
        finish(true);
      } else {
        say(cur.bossName + ": " + el.dataset.name + " 찾았다! " + remain.length + "개 남았어!", 1800);
      }
    } else {
      // 헛다리
      sfx.wrong();
      timeLeft = Math.max(0, timeLeft - WRONG_PENALTY);
      updateTimer();
      popText(el, "-" + WRONG_PENALTY + "초", "#e04b4b");
      var stage = $("stage");
      stage.classList.remove("shake");
      void stage.offsetWidth;
      stage.classList.add("shake");
      if (timeLeft <= 0) finish(false);
    }
  }

  function updateTimer() {
    var t = $("hud-timer");
    t.textContent = "⏱ " + timeLeft;
    t.classList.toggle("low", timeLeft <= 10);
  }

  function startLevel(i) {
    curIndex = i;
    cur = RESTAURANTS[i];
    remain = cur.targets.map(function (t) { return t.emoji; });
    timeLeft = cur.time;

    $("hud-restname").textContent = cur.emoji + " " + cur.name;
    $("hud-boss").textContent = cur.boss;
    $("btn-hint").textContent = "💡 힌트 (🪙" + HINT_COST + ")";

    buildFindList();
    drawScene(cur);
    refreshHud();
    updateTimer();
    show("screen-play");
    say(cur.bossName + ": " + cur.quest, 3400);

    running = true;
    clearInterval(timerId);
    timerId = setInterval(function () {
      if (!running) return;
      timeLeft--;
      updateTimer();
      if (timeLeft <= 0) finish(false);
    }, 1000);
  }

  function finish(win) {
    running = false;
    clearInterval(timerId);

    if (win) {
      sfx.clear();
      var bonus = CLEAR_BONUS + timeLeft * TIME_BONUS;
      save.coin += bonus;
      var leveledUp = !isCleared(cur.id);
      if (leveledUp) save.cleared.push(cur.id);
      writeSave();
      refreshHud();

      var next = RESTAURANTS[curIndex + 1];
      openPanel(
        '<div class="big">' + cur.boss + '</div>' +
        '<h2>사장님이 칭찬했어요!</h2>' +
        '<p>"' + cur.praise + '"</p>' +
        (leveledUp ? '<div class="levelup">⭐ 레벨 ' + level() + ' 달성!' +
          (next ? '<br>' + next.emoji + ' ' + next.name + ' 이(가) 열렸어요!' : '<br>모든 식당을 클리어했어요! 🏆') +
          '</div>' : '') +
        '<div class="reward">' +
          '<span class="chip coin">🪙 +' + bonus + '</span>' +
          '<span class="chip timer">⏱ ' + timeLeft + '초 남음</span>' +
        '</div>' +
        '<div class="panel-btns">' +
          (next ? '<button class="btn" data-act="next">' + next.emoji + ' ' + next.name + ' 가기</button>' : '') +
          '<button class="btn ghost" data-act="map">식당 목록으로</button>' +
        '</div>'
      );
    } else {
      sfx.fail();
      openPanel(
        '<div class="big">⏰</div>' +
        '<h2>시간 초과!</h2>' +
        '<p>' + (cur.targets.length - remain.length) + ' / ' + cur.targets.length +
        '개 찾았어요.<br>조금만 더 하면 될 것 같은데?</p>' +
        '<div class="panel-btns" style="margin-top:18px">' +
          '<button class="btn" data-act="retry">🔄 다시 도전</button>' +
          '<button class="btn ghost" data-act="map">식당 목록으로</button>' +
        '</div>'
      );
    }
  }

  function openPanel(html) {
    $("panel").innerHTML = html;
    $("overlay").classList.add("on");
  }
  function closePanel() { $("overlay").classList.remove("on"); }

  $("overlay").addEventListener("click", function (e) {
    var act = e.target.dataset ? e.target.dataset.act : null;
    if (!act) return;
    sfx.tap();
    closePanel();

    if (act === "next") startLevel(curIndex + 1);
    else if (act === "retry") startLevel(curIndex);
    else if (act === "map") { buildMap(); refreshHud(); show("screen-map"); }
    else if (act === "dowipe") {
      save = { coin: 0, cleared: [] };
      writeSave();
      refreshHud();
      buildMap();
    }
    // act === "close" 는 그냥 닫기만 하면 됩니다
  });

  /* ============================================================
     버튼
     ============================================================ */
  $("btn-start").addEventListener("click", function () {
    audio(); sfx.tap();
    buildMap(); refreshHud(); show("screen-map");
  });

  $("btn-help").addEventListener("click", function () {
    audio(); sfx.tap();
    openPanel(
      '<div class="big">🔎</div>' +
      '<h2>이렇게 하면 돼!</h2>' +
      '<div class="help-list">' +
        '1. 식당에 들어가면 사장님이 <b>잃어버린 물건</b>을 알려줘요<br>' +
        '2. 화면 위 목록을 보고 <b>가게 안에서 똑같은 걸 찾아 누르기</b><br>' +
        '3. 찾을 때마다 <b>코인 ' + COIN_PER_FIND + '개</b>! 시간이 남으면 보너스도 있어요<br>' +
        '4. 엉뚱한 걸 누르면 <b>시간이 ' + WRONG_PENALTY + '초 줄어요</b>. 조심!<br>' +
        '5. 다 찾으면 <b>레벨업</b>하고 새 식당이 열려요' +
      '</div>' +
      '<div class="panel-btns"><button class="btn" data-act="close">알겠어!</button></div>'
    );
  });

  $("btn-reset").addEventListener("click", function () {
    sfx.tap();
    openPanel(
      '<div class="big">🗑️</div>' +
      '<h2>기록을 지울까요?</h2>' +
      '<p>코인과 클리어한 식당이 모두 사라져요.</p>' +
      '<div class="panel-btns" style="margin-top:18px">' +
        '<button class="btn ghost" data-act="dowipe">네, 지울래요</button>' +
        '<button class="btn" data-act="close">아니요</button>' +
      '</div>'
    );
  });

  $("btn-map-back").addEventListener("click", function () { sfx.tap(); show("screen-title"); });

  $("btn-play-back").addEventListener("click", function () {
    running = false; clearInterval(timerId); sfx.tap();
    buildMap(); refreshHud(); show("screen-map");
  });

  $("btn-retry").addEventListener("click", function () { sfx.tap(); startLevel(curIndex); });

  $("btn-hint").addEventListener("click", function () {
    if (!running || remain.length === 0) return;
    if (save.coin < HINT_COST) { sfx.wrong(); say("코인이 부족해요! (🪙" + HINT_COST + " 필요)", 1800); return; }
    save.coin -= HINT_COST;
    refreshHud();
    writeSave();
    sfx.tap();

    var emoji = remain[0];
    var el = $("stage").querySelector('.obj[data-target="' + emoji + '"]:not(.gone)');
    if (el) {
      el.classList.remove("hint"); void el.offsetWidth; el.classList.add("hint");
      // 화면 밖이면 대충 어느 쪽인지 알려주기
      var y = parseFloat(el.style.top), x = parseFloat(el.style.left);
      say((y < 50 ? "위" : "아래") + "쪽 " + (x < 50 ? "왼" : "오른") + "편을 잘 봐!", 2200);
    }
    var chip = $("find-list").querySelector('[data-emoji="' + emoji + '"]');
    if (chip) { chip.classList.remove("hinting"); void chip.offsetWidth; chip.classList.add("hinting"); }
  });

  /* ============================================================
     시작
     ============================================================ */
  loadSave();
  refreshHud();
})();
</script>
</body>
</html>
