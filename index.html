<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한밤의 식당 대소동</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --night-0: #0b1026;
    --night-1: #1b2350;
    --night-2: #2d3670;
    --ink: #e8e6f5;
    --ink-soft: #9aa0c8;
    --panel: #171d3d;
    --panel-2: #212a52;
    --line: #3a4478;
    --brand: #ffb03a;
    --brand-dark: #d8871c;
    --gold: #ffd166;
    --ok: #4ad991;
    --bad: #ff6b6b;
    --lamp: #ffd9a0;
  }

  html, body {
    height: 100%;
    background: #05070f;
    color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body { display: flex; justify-content: center; overscroll-behavior: none; }

  #app {
    width: 100%; max-width: 920px; min-height: 100%;
    background: var(--night-0);
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }

  .screen { display: none; flex-direction: column; flex: 1; min-height: 0; }
  .screen.on { display: flex; }

  button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }

  .btn {
    background: var(--brand); color: #2b1a02; font-weight: 800;
    padding: 14px 26px; border-radius: 999px;
    box-shadow: 0 4px 0 var(--brand-dark);
    transition: transform .08s, box-shadow .08s; font-size: 17px;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--brand-dark); }
  .btn.ghost {
    background: var(--panel-2); color: var(--ink);
    box-shadow: 0 3px 0 #0d1230; border: 2px solid var(--line);
  }
  .btn.ghost:active { box-shadow: 0 0 0 #0d1230; }
  .btn:focus-visible, .rest-card:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

  /* ================= 타이틀 ================= */
  #screen-title {
    align-items: center; justify-content: center; gap: 16px;
    padding: 40px 24px; text-align: center; position: relative; overflow: hidden;
    background:
      radial-gradient(circle at 78% 18%, rgba(255,225,160,.22) 0 12%, transparent 40%),
      linear-gradient(180deg, #070b1c 0%, #131a42 55%, #2a2358 100%);
  }
  #screen-title .moon {
    position: absolute; right: 16%; top: 10%;
    width: 64px; height: 64px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff6d8, #ffd98a);
    box-shadow: 0 0 40px 10px rgba(255,214,138,.35);
  }
  #screen-title .stars { position: absolute; inset: 0; pointer-events: none; }
  #screen-title .stars i {
    position: absolute; width: 2px; height: 2px; border-radius: 50%;
    background: #fff; opacity: .8; animation: twinkle 3s infinite;
  }
  @keyframes twinkle { 0%,100% { opacity: .2; } 50% { opacity: .95; } }
  .logo-emoji { font-size: 66px; line-height: 1; position: relative; }
  .logo-emoji span { display: inline-block; animation: bob 2.4s ease-in-out infinite; }
  .logo-emoji span:nth-child(2) { animation-delay: .3s; }
  .logo-emoji span:nth-child(3) { animation-delay: .6s; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-12px) rotate(3deg); } }
  h1 { font-size: 34px; letter-spacing: -1px; position: relative; text-shadow: 0 0 18px rgba(255,209,102,.45); }
  .subtitle { color: var(--ink-soft); font-size: 15px; font-weight: 600; line-height: 1.7; position: relative; }
  .made-by { margin-top: 6px; font-size: 12px; color: var(--ink-soft); opacity: .7; position: relative; }

  /* ================= 상단바 ================= */
  .topbar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; background: var(--panel);
    border-bottom: 2px solid var(--line); flex: none;
  }
  .topbar .spacer { flex: 1; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--panel-2); border: 2px solid var(--line);
    border-radius: 999px; padding: 5px 12px;
    font-weight: 800; font-size: 14px; white-space: nowrap;
  }
  .chip.coin { border-color: #7a6320; background: #3a300f; color: var(--gold); }
  .chip.timer { border-color: #2b6b4e; background: #10301f; color: var(--ok); font-variant-numeric: tabular-nums; }
  .chip.timer.low { border-color: #7a2b2b; background: #3a1414; color: var(--bad); animation: pulse .6s infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  .back-btn { font-size: 22px; padding: 4px 8px; line-height: 1; }

  /* ================= 의뢰 목록 ================= */
  .quest {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: var(--panel);
    border-bottom: 2px solid var(--line); flex: none;
  }
  .boss-face {
    font-size: 24px; flex: none; width: 40px; height: 40px; border-radius: 50%;
    background: var(--panel-2); border: 2px solid var(--line);
    display: grid; place-items: center;
  }
  .find-list { display: flex; gap: 7px; overflow-x: auto; flex: 1; padding-bottom: 2px; scrollbar-width: none; }
  .find-list::-webkit-scrollbar { height: 0; }
  .find-item {
    flex: none; display: flex; flex-direction: column; align-items: center;
    background: var(--panel-2); border: 2px solid var(--line);
    border-radius: 13px; padding: 4px 9px 3px; min-width: 56px; transition: all .2s;
  }
  .find-item .fi-emoji { font-size: 21px; line-height: 1.15; }
  .find-item .fi-name { font-size: 11px; font-weight: 700; color: var(--ink-soft); white-space: nowrap; }
  .find-item.found { background: #123a28; border-color: #2b6b4e; }
  .find-item.found .fi-emoji { filter: grayscale(1); opacity: .4; }
  .find-item.found .fi-name { text-decoration: line-through; color: var(--ok); }
  .find-item.hinting { animation: hintPop .5s ease-in-out 3; }
  @keyframes hintPop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); background: #4a3a10; } }

  /* ================= 무대 (마을 / 가게 공용) ================= */
  .stage-wrap { flex: 1; min-height: 0; display: grid; place-items: center; padding: 6px; background: #05070f; }
  .stage {
    position: relative; width: 100%; max-width: 900px;
    aspect-ratio: 3 / 4; max-height: 100%;
    border-radius: 14px; overflow-x: auto; overflow-y: hidden;
    container-type: inline-size;
    box-shadow: 0 6px 18px rgba(0,0,0,.6);
    touch-action: pan-x; user-select: none; cursor: grab; scrollbar-width: none;
  }
  .stage::-webkit-scrollbar { height: 0; }
  .stage.dragging { cursor: grabbing; }
  @media (min-width: 700px) and (orientation: landscape) { .stage { aspect-ratio: 4 / 3; } }
  .stage.shake { animation: shake .3s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  .scene { position: relative; height: 100%; }

  /* ================= 밤의 마을 ================= */
  .town { width: 260%; background: linear-gradient(180deg, #060a1c 0%, #101743 45%, #232a5e 72%); }
  .sky-moon {
    position: absolute; left: 8%; top: 6%; width: 7cqw; height: 7cqw; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff6d8, #ffd98a);
    box-shadow: 0 0 6cqw 1.5cqw rgba(255,214,138,.3);
  }
  .star { position: absolute; width: .35cqw; height: .35cqw; border-radius: 50%; background: #fff; animation: twinkle 3s infinite; }

  .road { position: absolute; left: 0; right: 0; bottom: 0; height: 22%; background: #14162c; }
  .road::before {                       /* 인도 */
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 38%;
    background: #2a2c48; border-top: .4cqw solid #3a3d63;
  }
  .road::after {                        /* 중앙선 */
    content: ""; position: absolute; left: 0; right: 0; bottom: 32%; height: .5cqw;
    background: repeating-linear-gradient(90deg, #6b6f9a 0 3%, transparent 3% 7%);
  }

  .bldg { position: absolute; bottom: 22%; cursor: default; }
  .bldg .wallb {
    position: absolute; inset: 0; border-radius: .8cqw .8cqw 0 0;
    background: var(--bw); box-shadow: inset 0 0 0 .3cqw rgba(0,0,0,.35);
  }
  .bldg .roof {
    position: absolute; left: -3%; right: -3%; top: -1.6cqw; height: 1.8cqw;
    background: var(--br); border-radius: .5cqw;
  }
  .bldg .wins { position: absolute; left: 8%; right: 8%; top: 14%; bottom: 34%; display: grid; gap: 6%; }
  .bldg .win {
    background: #1b1f3d; border-radius: .3cqw;
    box-shadow: inset 0 0 0 .2cqw rgba(0,0,0,.4);
  }
  .bldg .win.lit { background: var(--lamp); box-shadow: 0 0 1.4cqw rgba(255,217,160,.65); }
  .bldg .door {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 0;
    width: 34%; height: 30%; background: #3a2a1c;
    border-radius: .6cqw .6cqw 0 0; box-shadow: inset 0 0 0 .3cqw rgba(0,0,0,.45);
  }
  .bldg .door::after {
    content: ""; position: absolute; right: 18%; top: 45%;
    width: .7cqw; height: .7cqw; border-radius: 50%; background: var(--gold);
  }

  /* 식당 간판 (네온) */
  .bldg .sign {
    position: absolute; left: -2%; right: -2%; top: 2%; height: 20%;
    background: #0e1130; border: .35cqw solid var(--sc);
    border-radius: .8cqw; display: flex; align-items: center; justify-content: center;
    gap: .6cqw; font-weight: 900; font-size: 2.3cqw; color: var(--sc);
    text-shadow: 0 0 1.4cqw var(--sc);
    box-shadow: 0 0 2cqw rgba(255,255,255,.14), inset 0 0 1.6cqw rgba(255,255,255,.12);
    white-space: nowrap;
  }
  .bldg.shop { cursor: pointer; }
  .bldg.shop:hover .sign, .bldg.shop:focus-visible .sign { filter: brightness(1.3); }
  .bldg.shop:hover .wallb { filter: brightness(1.12); }
  .bldg.filler .sign { border-color: #4a4f7a; color: #7b81ad; text-shadow: none; box-shadow: none; }

  /* 가게 앞 불빛 웅덩이 */
  .bldg.shop::after {
    content: ""; position: absolute; left: 50%; transform: translateX(-50%);
    bottom: -6%; width: 130%; height: 12%;
    background: radial-gradient(ellipse at 50% 50%, rgba(255,209,102,.4), transparent 70%);
    pointer-events: none;
  }

  .marker {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: -6.5cqw; font-size: 4.4cqw; z-index: 5; pointer-events: none;
    filter: drop-shadow(0 0 1.4cqw rgba(255,209,102,.9));
    animation: markerBob 1.1s ease-in-out infinite;
  }
  @keyframes markerBob { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-1.2cqw); } }

  .seen-badge {
    position: absolute; right: 2%; top: 24%;
    background: rgba(0,0,0,.6); border: .25cqw solid var(--line);
    border-radius: 999px; padding: .3cqw .9cqw;
    font-size: 1.7cqw; font-weight: 800; color: var(--ink-soft); z-index: 4;
  }

  /* 가로등은 건물 사이 빈 자리에 세우고 z-index 로 건물보다 앞에 둡니다 */
  .lamp { position: absolute; bottom: 20%; width: .7cqw; background: #565c8c; z-index: 3; }
  .lamp::before {                       /* 등갓 + 불빛 */
    content: ""; position: absolute; left: 50%; transform: translateX(-50%);
    top: -1.4cqw; width: 3.4cqw; height: 1.9cqw; border-radius: 50% 50% 40% 40%;
    background: radial-gradient(ellipse at 50% 30%, #fff4d4, var(--lamp));
    box-shadow: 0 0 4cqw 1.2cqw rgba(255,217,160,.5);
  }
  .lamp::after {                        /* 바닥에 떨어지는 불빛 */
    content: ""; position: absolute; left: 50%; transform: translateX(-50%);
    bottom: -1cqw; width: 12cqw; height: 3cqw; border-radius: 50%;
    background: radial-gradient(ellipse at 50% 50%, rgba(255,217,160,.35), transparent 70%);
  }

  /* ================= 가게 내부 ================= */
  .shop-in { width: 220%; }
  .wall { position: absolute; inset: 0 0 32% 0; background: var(--wall); }
  .wall::after {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.1) 0 1.2%, transparent 1.2% 3.4%);
  }
  .wainscot {
    position: absolute; left: 0; right: 0; bottom: 32%; height: 7%;
    background: var(--wood); border-bottom: .5cqw solid rgba(0,0,0,.3);
  }
  .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 32%; background: var(--floor); }
  .floor::after {
    content: ""; position: absolute; inset: 0;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.14) 0 .3%, transparent .3% 4%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 .5%, transparent .5% 12%);
  }
  /* 밤이라 가게 전체를 한 겹 어둡게 깔고… */
  .nightlight {
    position: absolute; inset: 0; z-index: 6; pointer-events: none;
    background: rgba(6,8,26,.44);
  }
  /* …전등이 그 위에서 다시 밝힙니다. screen 합성이라 덮는 게 아니라 빛이 더해집니다. */
  .ceilinglamp {
    position: absolute; top: 0; width: 26cqw; height: 62%; z-index: 7; pointer-events: none;
    background: radial-gradient(ellipse 50% 70% at 50% 0%, rgba(255,226,170,.75), rgba(255,214,150,.16) 55%, rgba(255,214,150,0) 78%);
    mix-blend-mode: screen;
  }
  .ceilinglamp::before {                 /* 전등갓 */
    content: ""; position: absolute; left: 50%; transform: translateX(-50%);
    top: 0; width: 3.4cqw; height: 1.3cqw; border-radius: 0 0 1.4cqw 1.4cqw;
    background: #f0dcb0; box-shadow: 0 0 2cqw rgba(255,226,170,.9);
  }

  .deco { position: absolute; z-index: 1; }
  .window {
    background: linear-gradient(180deg,#101740,#1d2a55);
    border: .8cqw solid var(--wood); border-radius: .6cqw; overflow: hidden;
  }
  .window::before, .window::after { content: ""; position: absolute; background: var(--wood); }
  .window::before { left: 50%; top: 0; bottom: 0; width: .7cqw; transform: translateX(-50%); }
  .window::after { top: 50%; left: 0; right: 0; height: .7cqw; transform: translateY(-50%); }
  .menuboard {
    background: #2b1f18; border: .7cqw solid var(--wood); border-radius: .8cqw;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: .4cqw; color: #ffe9b8; font-weight: 800; padding: .6cqw;
  }
  .menuboard .mb-title { font-size: 2.1cqw; }
  .menuboard .mb-row { font-size: 1.5cqw; opacity: .85; }
  .picture { background: var(--accent); border: .7cqw solid var(--wood); border-radius: .5cqw; display: grid; place-items: center; font-size: 3cqw; }
  .clock { background: #efe6d2; border: .7cqw solid var(--wood); border-radius: 50%; display: grid; place-items: center; font-size: 2.6cqw; }

  /* --- 가구 --- */
  .furn { position: absolute; z-index: 1; }
  .furn.can-open { cursor: pointer; }
  .furn.can-open::after {
    content: "✋"; position: absolute; right: -.6cqw; top: -2.2cqw;
    font-size: 2.4cqw; pointer-events: none;
    opacity: .6; animation: tapMe 2s ease-in-out infinite; transition: opacity .2s;
  }
  .furn.can-open:hover::after { opacity: 1; }
  .furn.can-open.open::after { opacity: 0; animation: none; }
  @keyframes tapMe { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-.6cqw); } }

  .body { position: absolute; inset: 0; border-radius: .8cqw; background: var(--cab); box-shadow: inset 0 -1cqw 0 rgba(0,0,0,.2), 0 .5cqw 0 rgba(0,0,0,.25); }
  .inside {
    position: absolute; inset: 6%; background: #1d1611; border-radius: .5cqw;
    display: flex; flex-wrap: wrap; align-content: center; justify-content: center;
    gap: 2%; padding: 4%;
    box-shadow: inset 0 0 1.5cqw rgba(0,0,0,.85);
    opacity: 0; pointer-events: none; transition: opacity .25s .15s;
  }
  .furn.open .inside { opacity: 1; pointer-events: auto; }

  .door2p, .door1p {
    position: absolute; top: 0; bottom: 0; width: 50%;
    background: var(--cab-door); border: .35cqw solid rgba(0,0,0,.3);
    border-radius: .6cqw; transition: transform .4s ease; backface-visibility: hidden;
  }
  .door2p.l { left: 0; transform-origin: left center; }
  .door2p.r { right: 0; transform-origin: right center; }
  .door1p { width: 100%; left: 0; transform-origin: left center; }
  .furn.open .door2p.l, .furn.open .door1p { transform: perspective(60cqw) rotateY(-118deg); }
  .furn.open .door2p.r { transform: perspective(60cqw) rotateY(118deg); }
  .handle { position: absolute; background: #d8d2c4; border-radius: .4cqw; box-shadow: 0 0 .3cqw rgba(0,0,0,.5); }
  .door2p .handle { top: 42%; width: .8cqw; height: 16%; }
  .door2p.l .handle { right: 8%; }
  .door2p.r .handle { left: 8%; }
  .door1p .handle { top: 42%; right: 6%; width: .8cqw; height: 16%; }

  .lid {
    position: absolute; left: -4%; right: -4%; top: 0; height: 16%;
    background: var(--cab-door); border-radius: .6cqw;
    transform-origin: left bottom; transition: transform .35s ease;
  }
  .furn.open .lid { transform: rotate(-105deg) translateY(-20%); }

  .flap {
    position: absolute; top: 0; width: 50%; height: 22%;
    background: var(--cab-door); border: .3cqw solid rgba(0,0,0,.25); transition: transform .35s ease;
  }
  .flap.l { left: 0; transform-origin: left bottom; }
  .flap.r { right: 0; transform-origin: right bottom; }
  .furn.open .flap.l { transform: rotate(-125deg); }
  .furn.open .flap.r { transform: rotate(125deg); }

  .drawer-front {
    position: absolute; left: 0; right: 0; background: var(--cab-door);
    border: .35cqw solid rgba(0,0,0,.3); border-radius: .4cqw; transition: transform .35s ease;
  }
  .drawer-front .handle { left: 50%; top: 38%; width: 26%; height: 22%; transform: translateX(-50%); }
  .furn.open .drawer-front { transform: translateY(46%) scale(1.04); }

  .tabletop { position: absolute; left: 0; right: 0; top: 0; height: 22%; background: var(--wood); border-radius: 1cqw; box-shadow: 0 .4cqw 0 rgba(0,0,0,.3); }
  .leg { position: absolute; width: 8%; background: var(--wood); filter: brightness(.8); }
  .chair { position: absolute; background: var(--wood); border-radius: .5cqw; filter: brightness(.92); box-shadow: 0 .4cqw 0 rgba(0,0,0,.25); }
  .shelfboard { position: absolute; left: 0; right: 0; bottom: 0; height: 24%; background: var(--wood); border-radius: .4cqw; box-shadow: 0 .4cqw 0 rgba(0,0,0,.3); }
  .plant-pot { position: absolute; left: 15%; right: 15%; bottom: 0; height: 45%; background: #8d4a2e; border-radius: 0 0 1cqw 1cqw; }
  .plant-leaf { position: absolute; left: 0; right: 0; top: 0; height: 60%; display: grid; place-items: center; font-size: 5cqw; }
  .label {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: -2.6cqw;
    font-size: 2.1cqw; font-weight: 800; color: #fff; white-space: nowrap; pointer-events: none;
    text-shadow: 0 .2cqw .3cqw rgba(0,0,0,.9), 0 0 .6cqw rgba(0,0,0,.8);
  }

  /* --- 물건 --- */
  .obj { position: relative; line-height: 1; cursor: pointer; transform: rotate(var(--rot)); transition: transform .12s; filter: drop-shadow(0 .2cqw .2cqw rgba(0,0,0,.6)); }
  .obj:active { transform: rotate(var(--rot)) scale(1.15); }
  .obj.gone { animation: found .45s forwards; pointer-events: none; }
  @keyframes found {
    0% { opacity: 1; }
    45% { transform: scale(1.9); filter: drop-shadow(0 0 1.5cqw #ffd479); opacity: 1; }
    100% { transform: scale(0); opacity: 0; }
  }
  .obj.hint { animation: hintRing 1.6s; }
  @keyframes hintRing {
    0%,100% { filter: drop-shadow(0 .2cqw .2cqw rgba(0,0,0,.6)); }
    50% { filter: drop-shadow(0 0 1.6cqw #ffd479) drop-shadow(0 0 2.6cqw #ffb020); }
  }

  .pop {
    position: absolute; transform: translate(-50%,-50%); font-weight: 900; font-size: 2.4cqw;
    pointer-events: none; animation: popUp .9s forwards; z-index: 90;
    text-shadow: 0 .2cqw .3cqw rgba(0,0,0,.9);
  }
  @keyframes popUp {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(.6); }
    25% { opacity: 1; transform: translate(-50%,-90%) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%,-170%) scale(1); }
  }

  .bubble {
    position: absolute; bottom: 4%; transform: translateX(-50%);
    background: rgba(255,252,244,.97); color: #24203a; border: .5cqw solid #0d1230;
    border-radius: 2cqw; padding: 1.4cqw 2.2cqw;
    font-weight: 800; font-size: 2.1cqw; text-align: center;
    max-width: 74%; z-index: 95; pointer-events: none;
    box-shadow: 0 .5cqw 0 rgba(0,0,0,.45); animation: bubbleIn .3s;
  }

    var t = $("hud-timer");
    t.textContent = "⏱ " + mmss(Math.max(0, timeLeft));
    t.classList.toggle("low", timeLeft <= 20);
  }

  function buildFindList() {
    var b = $("find-list");
    b.innerHTML = "";
    if (!quest) return;
    quest.items.forEach(function (it, i) {
      var d = el("find-item");
      d.dataset.idx = i;
      if (it.found) d.classList.add("found");
      d.innerHTML = '<div class="fi-emoji">' + it.emoji + '</div><div class="fi-name">' + it.name + '</div>';
      b.appendChild(d);
    });
  }

  function say(text, who, ms) {
    var stage = $("stage"), scene = stage.querySelector(".scene");
    if (!scene) return;
    var old = scene.querySelector(".bubble");
    if (old) old.remove();
    var b = el("bubble");
    b.innerHTML = (who ? '<span class="who">' + who + '</span>' : "") + text;
    // 지금 보고 있는 화면 한가운데에 띄웁니다
    b.style.left = ((stage.scrollLeft + stage.clientWidth / 2) / scene.offsetWidth * 100) + "%";
    scene.appendChild(b);
    setTimeout(function () { if (b.parentNode) b.remove(); }, ms || 3000);
  }

  function hintText(msg) {
    var stage = $("stage");
    var h = el("scroll-hint");
    h.textContent = msg;
    stage.appendChild(h);
    setTimeout(function () { if (h.parentNode) h.remove(); }, 3600);
  }

  /* ============================================================
     8. 밤 마을 그리기
     ============================================================ */
  function drawTown() {
    var stage = $("stage");
    stage.innerHTML = "";
    stage.scrollLeft = 0;

    var scene = el("scene town");

    // 별
    for (var i = 0; i < 70; i++) {
      var s = el("star");
      s.style.left = rand(0, 100).toFixed(2) + "%";
      s.style.top = rand(0, 55).toFixed(2) + "%";
      s.style.animationDelay = rand(0, 3).toFixed(2) + "s";
      scene.appendChild(s);
    }
    scene.appendChild(el("sky-moon"));

    scene.appendChild(el("road"));

    // 식당이 아닌 건물
    FILLERS.forEach(function (f) {
      var b = el("bldg filler", "left:" + f.x + "%;width:" + f.w + "%;height:" + f.h + "%;--bw:#2c3055;--br:#212445;--sc:#4a4f7a");
      b.appendChild(el("roof"));
      b.appendChild(el("wallb"));
      var sg = el("sign"); sg.textContent = f.emoji + " " + f.name; b.appendChild(sg);
      b.appendChild(makeWindows(3, 2, .3));
      b.appendChild(el("door"));
      scene.appendChild(b);
    });

    // 식당
    SHOPS.forEach(function (s) {
      var b = el("bldg shop",
        "left:" + s.x + "%;width:" + s.w + "%;height:" + s.h + "%;" +
        "--bw:" + s.bw + ";--br:" + s.br + ";--sc:" + s.sign);
      b.dataset.shop = s.id;
      b.setAttribute("role", "button");
      b.setAttribute("tabindex", "0");
      b.setAttribute("aria-label", s.name + " 들어가기");
      b.appendChild(el("roof"));
      b.appendChild(el("wallb"));
      var sg = el("sign"); sg.textContent = s.emoji + " " + s.name; b.appendChild(sg);
      b.appendChild(makeWindows(3, 3, .8));
      b.appendChild(el("door"));

      // 의뢰 표시
      if (quest && s.id === quest.from) {
        if (phase === "brief") { var m1 = el("marker"); m1.textContent = "❗"; b.appendChild(m1); }
        else if (phase === "deliver") { var m2 = el("marker"); m2.textContent = "🎁"; b.appendChild(m2); }
      }
      if (visited[s.id] && phase === "search") {
        var sb = el("seen-badge"); sb.textContent = "🔎 가봄"; b.appendChild(sb);
      }
      scene.appendChild(b);
    });

    // 가로등은 건물을 다 그린 뒤에 세워야 건물에 가리지 않습니다.
    // 위치는 건물과 건물 사이 빈 자리입니다.
    [8.8, 23, 32.2, 46, 59, 68.8, 83, 98].forEach(function (x) {
      scene.appendChild(el("lamp", "left:" + x + "%;height:14%"));
    });

    scene.addEventListener("click", onTapBuilding);
    scene.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") onTapBuilding(e);
    });

    stage.appendChild(scene);
    where = "town";
    $("hud-place").textContent = "🌙 밤 마을";
    $("btn-leave").style.display = "none";
    hintText("← 옆으로 밀어서 마을을 둘러보세요 →");
  }

  function makeWindows(cols, rows, litChance) {
    var w = el("wins");
    w.style.gridTemplateColumns = "repeat(" + cols + ",1fr)";
    w.style.gridTemplateRows = "repeat(" + rows + ",1fr)";
    for (var i = 0; i < cols * rows; i++) {
      var win = el("win" + (Math.random() < litChance ? " lit" : ""));
      w.appendChild(win);
    }
    return w;
  }

  function onTapBuilding(e) {
    if (dragged) return;
    var b = e.target.closest(".bldg");
    if (!b) return;
    if (!b.classList.contains("shop")) {
      sfx.wrong();
      say("여긴 식당이 아니에요!", null, 1500);
      return;
    }
    enterShop(b.dataset.shop);
  }

  /* ============================================================
     9. 가게 내부 그리기
     ============================================================ */
  function buildFurniture(f) {
    var node = el("furn " + f.type, "left:" + f.x + "%;top:" + f.y + "%;width:" + f.w + "%;height:" + f.h + "%");
    node.dataset.fid = f.id;
    var host;

    if (f.type === "door2" || f.type === "door1") {
      node.appendChild(el("body"));
      host = el("inside"); node.appendChild(host);
      if (f.type === "door2") {
        var dl = el("door2p l"), dr = el("door2p r");
        dl.appendChild(el("handle")); dr.appendChild(el("handle"));
        node.appendChild(dl); node.appendChild(dr);
      } else {
        var d1 = el("door1p"); d1.appendChild(el("handle")); node.appendChild(d1);
      }
      node.classList.add("can-open");

    } else if (f.type === "drawer") {
      node.appendChild(el("body"));
      host = el("inside", "inset:4% 6% 46% 6%"); node.appendChild(host);
      var df = el("drawer-front", "top:40%;height:56%");
      df.appendChild(el("handle")); node.appendChild(df);
      node.classList.add("can-open");

    } else if (f.type === "lid") {
      node.appendChild(el("body"));
      host = el("inside", "inset:20% 10% 6% 10%"); node.appendChild(host);
      node.appendChild(el("lid"));
      node.classList.add("can-open");

    } else if (f.type === "flap") {
      node.appendChild(el("body"));
      host = el("inside", "inset:18% 8% 8% 8%"); node.appendChild(host);
      node.appendChild(el("flap l")); node.appendChild(el("flap r"));
      node.classList.add("can-open");

    } else if (f.type === "shelf") {
      node.appendChild(el("shelfboard"));
      host = el("", "position:absolute;left:2%;right:2%;bottom:24%;display:flex;justify-content:space-around;align-items:flex-end");

    } else if (f.type === "counter") {
      node.appendChild(el("tabletop"));
      node.appendChild(el("body", "top:22%;border-radius:0 0 .6cqw .6cqw"));
      host = el("", "position:absolute;left:3%;right:3%;top:0;transform:translateY(-88%);display:flex;justify-content:space-around;align-items:flex-end");

    } else if (f.type === "table") {
      node.appendChild(el("tabletop"));
      node.appendChild(el("leg", "left:10%;top:22%;bottom:0"));
      node.appendChild(el("leg", "right:10%;top:22%;bottom:0"));
      node.appendChild(el("chair", "left:-16%;top:34%;width:14%;height:12%"));
      node.appendChild(el("chair", "right:-16%;top:34%;width:14%;height:12%"));
      host = el("", "position:absolute;left:4%;right:4%;top:0;transform:translateY(-88%);display:flex;justify-content:space-around;align-items:flex-end");

    } else if (f.type === "under") {
      node.appendChild(el("", "position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(0,0,0,.45),transparent 70%)"));
      host = el("", "position:absolute;inset:0;display:flex;justify-content:space-around;align-items:center");

    } else if (f.type === "plant") {
      node.appendChild(el("plant-pot"));
      var lf = el("plant-leaf"); lf.textContent = "🪴"; node.appendChild(lf);
      host = el("", "position:absolute;left:-70%;right:-70%;bottom:0;height:40%;display:flex;justify-content:space-around;align-items:flex-end;z-index:-1");
    }

    // 문 없는 자리(선반·테이블·카운터)는 위에서 host 를 안 붙였으므로 여기서 붙입니다.
    // 안 붙이면 그 자리에 놓은 물건이 화면에 아예 안 나옵니다.
    if (host && !host.parentNode) node.appendChild(host);

    if (f.name && f.kind === "in") {
      var lb = el("label"); lb.textContent = f.name; node.appendChild(lb);
    }
    return { node: node, host: host };
  }

  function makeObj(emoji, itemIdx) {
    var o = el("obj");
    o.textContent = emoji;
    o.style.fontSize = rand(2.8, 4.2).toFixed(2) + "cqw";
    o.style.setProperty("--rot", rand(-25, 25).toFixed(0) + "deg");
    if (itemIdx !== null && itemIdx !== undefined) o.dataset.item = itemIdx;
    o.addEventListener("click", onTapObject);
    return o;
  }

  function drawShop(s) {
    var stage = $("stage");
    stage.innerHTML = "";
    stage.scrollLeft = 0;

    var c = s.colors;
    var scene = el("scene shop-in");
    scene.style.setProperty("--wall", c.wall);
    scene.style.setProperty("--wood", c.wood);
    scene.style.setProperty("--floor", c.floor);
    scene.style.setProperty("--cab", c.cab);
    scene.style.setProperty("--cab-door", c.cabDoor);
    scene.style.setProperty("--accent", c.accent);

    scene.appendChild(el("wall"));
    scene.appendChild(el("wainscot"));
    scene.appendChild(el("floor"));

    // 천장 전등 (밤이라 이 아래가 환합니다)
    [10, 30, 50, 70, 90].forEach(function (x) {
      scene.appendChild(el("ceilinglamp", "left:" + x + "%;transform:translateX(-50%)"));
    });

    var menu = el("deco menuboard", "left:41%;top:12%;width:13%;height:20%");
    menu.innerHTML = '<div class="mb-title">' + s.emoji + ' ' + s.name + '</div>' +
      s.menu.map(function (m) { return '<div class="mb-row">' + m + '</div>'; }).join("");
    scene.appendChild(menu);
    scene.appendChild(el("deco window", "left:72%;top:12%;width:13%;height:22%"));
    var pic = el("deco picture", "left:30%;top:34%;width:7%;height:11%");
    pic.textContent = s.wallProps[0]; scene.appendChild(pic);
    var clk = el("deco clock", "left:86%;top:12%;width:6%;height:11%");
    clk.textContent = s.wallProps[1]; scene.appendChild(clk);

    // 가구
    var slots = [];
    LAYOUT.forEach(function (f) {
      var built = buildFurniture(f);
      scene.appendChild(built.node);
      for (var i = 0; i < f.cap; i++) slots.push({ f: f, host: built.host });
    });

    var inSlots   = shuffle(slots.filter(function (x) { return x.f.kind === "in"; }));
    var openSlots = shuffle(slots.filter(function (x) { return x.f.kind !== "in"; }));

    // 이 가게에 숨어 있고 아직 못 찾은 의뢰 물건
    var mine = [];
    quest.items.forEach(function (it, i) {
      if (it.shop === s.id && !it.found) mine.push({ item: it, idx: i });
    });

    mine.forEach(function (m, i) {
      var useIn = (i / Math.max(1, mine.length)) < quest.hideRatio;
      var pool = useIn ? inSlots : openSlots;
      if (!pool.length) pool = useIn ? openSlots : inSlots;
      var slot = pool.shift();
      slot.host.appendChild(makeObj(m.item.emoji, m.idx));
    });

    // 나머지는 방해물
    var targetEmojis = quest.items.map(function (it) { return it.emoji; });
    var decoys = s.decoys.filter(function (d) { return targetEmojis.indexOf(d) === -1; });
    shuffle(inSlots.concat(openSlots)).forEach(function (slot) {
      if (Math.random() < 0.12) return;   // 조금 비워둬야 자연스럽습니다
      slot.host.appendChild(makeObj(pick(decoys), null));
    });

    scene.appendChild(el("nightlight"));
    scene.addEventListener("click", onTapFurniture);
    stage.appendChild(scene);
  }

  /* ============================================================
     10. 출입
     ============================================================ */
  function enterShop(id) {
    var s = shopById(id);
    if (!s) return;

    if (phase === "brief") {
      if (id !== quest.from) {
        sfx.wrong();
        var g = shopById(quest.from);
        say(g.emoji + " " + g.name + " 사장님이 부르고 있어요! (❗ 표시)", null, 2400);
        return;
      }
      sfx.enter();
      where = id;
      drawShop(s);
      $("hud-place").textContent = s.emoji + " " + s.name;
      $("btn-leave").style.display = "";
      // 사장님이 나와서 의뢰합니다
      setTimeout(function () {
        openPanel(
          '<div class="big">' + s.boss + '</div><h2>' + s.bossName + '</h2>' +
          '<p class="quote">"' + quest.ask + '"</p>' +
          '<div class="questlist">' +
          quest.items.map(function (it) { return '<div class="qi">' + it.emoji + ' ' + it.name + '</div>'; }).join("") +
          '</div>' +
          '<p style="margin-top:12px">물건은 <b>마을 곳곳의 식당</b>에 흩어져 있어요.<br>' +
          '제한 시간 <b>' + timeWords(quest.time) + '</b>' +
          '</p><div class="panel-btns" style="margin-top:18px">' +
          '<button class="btn" data-act="accept">알겠어요! 찾아올게요 🔎</button></div>'
        );
      }, 400);
      return;
    }

    if (phase === "deliver" && id === quest.from) {
      sfx.enter();
      where = id;
      drawShop(s);
      $("hud-place").textContent = s.emoji + " " + s.name;
      $("btn-leave").style.display = "";
      setTimeout(function () { deliver(); }, 400);
      return;
    }

    // 찾는 중 — 아무 식당이나 들어갈 수 있습니다
    sfx.enter();
    where = id;
    visited[id] = true;
    drawShop(s);
    $("hud-place").textContent = s.emoji + " " + s.name;
    $("btn-leave").style.display = "";
    var here = quest.items.filter(function (it) { return it.shop === id && !it.found; }).length;
    setTimeout(function () {
      if (phase === "deliver") say("다 찾았어요! 의뢰한 사장님께 갖다주세요 🎁", null, 2600);
      else if (here) say("여기 뭔가 있는 것 같아... 잘 뒤져보자!", null, 2400);
      else say("여긴 찾는 물건이 없나 봐. 다른 가게로 가보자!", null, 2600);
    }, 350);
  }

  function leaveShop() {
    if (where === "town") return;
    sfx.tap();
    drawTown();
  }

  /* ============================================================
     11. 조작
     ============================================================ */
  function onTapFurniture(e) {
    if (!running || dragged) return;
    if (e.target.closest(".obj")) return;
    var f = e.target.closest(".furn.can-open");
    if (!f) return;
    f.classList.toggle("open");
    if (f.classList.contains("open")) sfx.open();
  }

  function onTapObject(e) {
    if (!running || dragged) return;
    e.stopPropagation();
    var o = e.currentTarget;
    var idx = o.dataset.item;

    if (idx !== undefined && quest.items[idx] && !quest.items[idx].found) {
      var it = quest.items[idx];
      it.found = true;
      o.classList.add("gone");
      sfx.find();
      popAt(o, "+" + COIN_PER_FIND + " 🪙", "#ffd166");
      save.coin += COIN_PER_FIND;
      refreshHud();
      var chip = $("find-list").querySelector('[data-idx="' + idx + '"]');
      if (chip) chip.classList.add("found");

      var left = quest.items.filter(function (x) { return !x.found; }).length;
      if (left === 0) {
        phase = "deliver";
        var g = shopById(quest.from);
        say("다 찾았다! " + g.emoji + " " + g.name + " 사장님께 갖다주자! 🎁", null, 3200);
      } else {
        say(it.name + " 찾았다! " + left + "개 남았어!", null, 1900);
      }
    } else {
      sfx.wrong();
      timeLeft = Math.max(0, timeLeft - WRONG_PENALTY);
      updateTimer();
      popAt(o, "-" + WRONG_PENALTY + "초", "#ff6b6b");
      var st = $("stage");
      st.classList.remove("shake"); void st.offsetWidth; st.classList.add("shake");
      if (timeLeft <= 0) fail();
    }
  }

  function popAt(o, text, color) {
    var stage = $("stage"), scene = stage.querySelector(".scene");
    if (!scene) return;
    var a = o.getBoundingClientRect(), b = scene.getBoundingClientRect();
    var p = el("pop");
    p.textContent = text; p.style.color = color;
    p.style.left = ((a.left + a.width / 2 - b.left) / b.width * 100) + "%";
    p.style.top = ((a.top + a.height / 2 - b.top) / b.height * 100) + "%";
    scene.appendChild(p);
    setTimeout(function () { if (p.parentNode) p.remove(); }, 950);
  }

  // 드래그로 둘러보기 (마우스). 터치는 브라우저 기본 스크롤을 씁니다.
  (function () {
    var stage = $("stage"), down = false, sx = 0, sl = 0;
    stage.addEventListener("pointerdown", function (e) {
      if (e.pointerType === "touch") return;
      down = true; dragged = false; sx = e.clientX; sl = stage.scrollLeft;
      stage.classList.add("dragging");
    });
    stage.addEventListener("pointermove", function (e) {
      if (!down) return;
      var dx = e.clientX - sx;
      if (Math.abs(dx) > 6) dragged = true;
      stage.scrollLeft = sl - dx;
    });
    function up() { down = false; stage.classList.remove("dragging"); setTimeout(function () { dragged = false; }, 0); }
    stage.addEventListener("pointerup", up);
    stage.addEventListener("pointercancel", up);
    stage.addEventListener("pointerleave", up);
  })();

  /* ============================================================
     12. 의뢰 진행
     ============================================================ */
  function startQuest(i) {
    questIdx = i;
    var q = QUESTS[i];
    quest = {
      from: q.from, time: q.time, hideRatio: q.hideRatio,
      ask: q.ask, praise: q.praise,
      items: q.items.map(function (it) { return { emoji: it.emoji, name: it.name, shop: it.shop, found: false }; })
    };
    phase = "brief";
    visited = {};
    timeLeft = q.time;
    running = false;
    clearInterval(timerId);

    var g = shopById(q.from);
    $("hud-boss").textContent = g.boss;
    $("btn-hint").textContent = "💡 힌트 (🪙" + HINT_COST + ")";
    buildFindList();
    refreshHud();
    updateTimer();
    show("screen-play");
    drawTown();

    // 의뢰한 가게가 보이도록 화면을 옮겨줍니다
    setTimeout(function () {
      var stage = $("stage"), b = stage.querySelector('.bldg[data-shop="' + q.from + '"]');
      if (b) stage.scrollTo({ left: Math.max(0, b.offsetLeft + b.offsetWidth / 2 - stage.clientWidth / 2), behavior: "smooth" });
      setTimeout(function () { say(g.emoji + " " + g.name + " 사장님이 부르고 있어요! 들어가 보세요", null, 3400); }, 500);
    }, 300);
  }

  function acceptQuest() {
    phase = "search";
    running = true;
    visited[quest.from] = true;
    clearInterval(timerId);
    timerId = setInterval(function () {
      if (!running) return;
      timeLeft--;
      updateTimer();
      if (timeLeft <= 0) fail();
    }, 1000);
    say("여기부터 뒤져볼까? 다른 가게에도 있을 거야!", null, 2600);
  }

  function deliver() {
    running = false;
    clearInterval(timerId);
    sfx.clear();
    var g = shopById(quest.from);
    var bonus = CLEAR_BONUS + Math.floor(timeLeft * TIME_BONUS);
    save.coin += bonus;
    var up = save.done.indexOf(quest.from) === -1;
    if (up) save.done.push(quest.from);
    writeSave(); refreshHud();

    var next = QUESTS[questIdx + 1];
    openPanel(
      '<div class="big">' + g.boss + '</div><h2>사장님이 칭찬했어요!</h2>' +
      '<p class="quote">"' + quest.praise + '"</p>' +
      (up ? '<div class="levelup">⭐ 레벨 ' + level() + ' 달성!' +
        (next ? '<br>다음 의뢰: ' + shopById(next.from).emoji + ' ' + shopById(next.from).name +
        '<br>물건이 ' + next.items.length + '개나 흩어져 있대요!'
        : '<br>마을의 모든 의뢰를 끝냈어요! 🏆') + '</div>' : '') +
      '<div class="reward"><span class="chip coin">🪙 +' + bonus + '</span>' +
      '<span class="chip timer">⏱ ' + timeWords(Math.max(0, timeLeft)) + ' 남음</span></div>' +
      '<div class="panel-btns">' +
      (next ? '<button class="btn" data-act="nextquest">다음 의뢰 받으러 가기 🌙</button>' : '') +
      '<button class="btn ghost" data-act="title">처음 화면으로</button></div>'
    );
  }

  function fail() {
    running = false;
    clearInterval(timerId);
    sfx.fail();
    var got = quest.items.filter(function (x) { return x.found; }).length;
    openPanel(
      '<div class="big">🌅</div><h2>아침이 밝았어요!</h2>' +
      '<p>' + got + ' / ' + quest.items.length + '개 찾았어요.<br>' +
      '냉장고랑 서랍도 열어봤어? 다른 가게도 가봐야 해!</p>' +
      '<div class="panel-btns" style="margin-top:18px">' +
      '<button class="btn" data-act="retry">🔄 다시 도전</button>' +
      '<button class="btn ghost" data-act="title">처음 화면으로</button></div>'
    );
  }

  function openPanel(html) { $("panel").innerHTML = html; $("overlay").classList.add("on"); }
  function closePanel() { $("overlay").classList.remove("on"); }

  $("overlay").addEventListener("click", function (e) {
    var act = e.target.dataset ? e.target.dataset.act : null;
    if (!act) return;
    sfx.tap(); closePanel();
    if (act === "accept") acceptQuest();
    else if (act === "nextquest") startQuest(questIdx + 1);
    else if (act === "retry") startQuest(questIdx);
    else if (act === "title") { running = false; clearInterval(timerId); show("screen-title"); }
    else if (act === "dowipe") { save = { coin: 0, done: [] }; writeSave(); refreshHud(); }
  });

  /* ============================================================
     13. 버튼
     ============================================================ */
  $("btn-start").addEventListener("click", function () {
    audio(); sfx.tap();
    startQuest(Math.min(save.done.length, QUESTS.length - 1));
  });

  $("btn-help").addEventListener("click", function () {
    audio(); sfx.tap();
    openPanel(
      '<div class="big">🌙</div><h2>이렇게 하면 돼!</h2>' +
      '<div class="help-list">' +
      '1. 밤 마을을 <b>옆으로 밀어서</b> 둘러봐요. 식당도 있고 아닌 건물도 있어요<br>' +
      '2. <b>❗ 표시가 뜬 식당</b>에 들어가면 사장님이 의뢰를 줘요<br>' +
      '3. 찾는 물건은 <b>여러 식당에 흩어져</b> 있어요. 돌아다니며 찾아야 해요<br>' +
      '4. 가게 안에서 <b>냉장고 · 찬장 · 서랍 · 상자 · 쓰레기통</b>을 열어보세요 (✋)<br>' +
      '5. 테이블 위, 테이블 밑, 화분 뒤도 잘 보세요<br>' +
      '6. 다 찾으면 <b>🎁 표시가 뜬 의뢰한 식당</b>으로 돌아가 갖다주세요<br>' +
      '7. 엉뚱한 걸 누르면 <b>시간이 ' + WRONG_PENALTY + '초 줄어요</b>' +
      '</div><div class="panel-btns"><button class="btn" data-act="close">알겠어!</button></div>'
    );
  });

  $("btn-reset").addEventListener("click", function () {
    sfx.tap();
    openPanel(
      '<div class="big">🗑️</div><h2>기록을 지울까요?</h2>' +
      '<p>코인과 끝낸 의뢰가 모두 사라져요.</p>' +
      '<div class="panel-btns" style="margin-top:18px">' +
      '<button class="btn ghost" data-act="dowipe">네, 지울래요</button>' +
      '<button class="btn" data-act="close">아니요</button></div>'
    );
  });

  $("btn-back").addEventListener("click", function () {
    sfx.tap();
    if (where !== "town") leaveShop();
    else { running = false; clearInterval(timerId); show("screen-title"); }
  });

  $("btn-leave").addEventListener("click", leaveShop);

  $("btn-hint").addEventListener("click", function () {
    if (!quest || phase === "brief") return;
    var un = [];
    quest.items.forEach(function (it, i) { if (!it.found) un.push({ it: it, i: i }); });
    if (!un.length) {
      var g = shopById(quest.from);
      say("다 찾았어요! " + g.name + " 으로 가세요 🎁", null, 2400);
      return;
    }
    if (save.coin < HINT_COST) { sfx.wrong(); say("코인이 부족해요! (🪙" + HINT_COST + " 필요)", null, 2200); return; }
    save.coin -= HINT_COST; refreshHud(); writeSave(); sfx.tap();

    var target = un[0];
    var chip = $("find-list").querySelector('[data-idx="' + target.i + '"]');
    if (chip) { chip.classList.remove("hinting"); void chip.offsetWidth; chip.classList.add("hinting"); }

    var stage = $("stage");
    if (where === target.it.shop) {
      // 이 가게 안에 있다면 어느 가구인지 알려줍니다
      var o = stage.querySelector('.obj[data-item="' + target.i + '"]:not(.gone)');
      if (o) {
        var furn = o.closest(".furn");
        var fname = furn ? (LAYOUT.filter(function (f) { return f.id === furn.dataset.fid; })[0] || {}).name : null;
        if (furn) stage.scrollTo({ left: Math.max(0, furn.offsetLeft + furn.offsetWidth / 2 - stage.clientWidth / 2), behavior: "smooth" });
        o.classList.remove("hint"); void o.offsetWidth; o.classList.add("hint");
        setTimeout(function () { say(target.it.name + " 은(는) " + (fname || "이 근처") + " 에 있어!", null, 2600); }, 350);
      }
    } else {
      // 다른 가게에 있다면 어느 식당인지 알려줍니다
      var sh = shopById(target.it.shop);
      say(target.it.name + " 은(는) " + sh.emoji + " " + sh.name + " 에 있어요!", null, 3000);
      if (where === "town") {
        var b = stage.querySelector('.bldg[data-shop="' + sh.id + '"]');
        if (b) stage.scrollTo({ left: Math.max(0, b.offsetLeft + b.offsetWidth / 2 - stage.clientWidth / 2), behavior: "smooth" });
      }
    }
  });

  // 타이틀 별
  (function () {
    var box = $("title-stars");
    for (var i = 0; i < 40; i++) {
      var s = document.createElement("i");
      s.style.left = rand(0, 100).toFixed(2) + "%";
      s.style.top = rand(0, 70).toFixed(2) + "%";
      s.style.animationDelay = rand(0, 3).toFixed(2) + "s";
      box.appendChild(s);
    }
  })();

  loadSave();
  refreshHud();
})();
</script>
</body>
</html>
