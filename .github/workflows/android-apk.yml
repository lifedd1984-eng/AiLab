name: Android APK

on:
  push:
    branches: ["claude/**", "main"]
    paths: ["android/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quickchecklist-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to release (fixed download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk QuickChecklist-debug.apk
          gh release view checklist-apk --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create checklist-apk --repo "$GITHUB_REPOSITORY" \
              --title "빠른 체크리스트 — Android APK (debug)" \
              --notes "휴대폰 브라우저로 이 페이지를 열고 QuickChecklist-debug.apk를 눌러 설치하세요. 최신 커밋 빌드로 자동 갱신됩니다."
          gh release upload checklist-apk QuickChecklist-debug.apk --repo "$GITHUB_REPOSITORY" --clobber
          # apk-latest는 다른 테스트 앱(손전등)의 릴리스 — 잘못 올라간 체크리스트 APK 정리 (없으면 no-op)
          gh release delete-asset apk-latest QuickChecklist-debug.apk --repo "$GITHUB_REPOSITORY" --yes || true
