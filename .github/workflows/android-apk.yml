name: Android APK

on:
  push:
    branches: ["claude/**", "main"]
    paths: ["android/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quickchecklist-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to release (fixed download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk QuickChecklist-debug.apk
          gh release view apk-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create apk-latest --repo "$GITHUB_REPOSITORY" \
              --title "빠른 체크리스트 — Android APK (debug)" \
              --notes "홈 화면 위젯 체크리스트 앱의 개발용 설치 파일. 최신 커밋 빌드로 자동 갱신됩니다."
          gh release upload apk-latest QuickChecklist-debug.apk --repo "$GITHUB_REPOSITORY" --clobber
