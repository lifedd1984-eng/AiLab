# XcodeGen 프로젝트 정의 — `xcodegen generate`로 .xcodeproj 생성
# 사용 전 변경 필요: bundleIdPrefix와 App Group ID (SETUP.md 참고)
name: QuickChecklist
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"   # iPhone 전용
    CODE_SIGN_STYLE: Automatic

targets:
  QuickChecklist:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.quickchecklist
    sources:
      - ChecklistApp
      - Shared
    entitlements:
      path: ChecklistApp/ChecklistApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.quickchecklist
    info:
      path: ChecklistApp/Info.plist
      properties:
        CFBundleDisplayName: 빠른 체크리스트
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: checklist-deeplink
            CFBundleURLSchemes:
              - checklist
    dependencies:
      - target: ChecklistWidget
        embed: true

  ChecklistWidget:
    type: app-extension
    platform: iOS
    settings:
      base:
        # 익스텐션 번들 ID는 반드시 앱 번들 ID의 하위여야 함 (ValidateEmbeddedBinary)
        PRODUCT_BUNDLE_IDENTIFIER: com.example.quickchecklist.widget
    sources:
      - ChecklistWidget
      - Shared
    entitlements:
      path: ChecklistWidget/ChecklistWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.quickchecklist
    info:
      path: ChecklistWidget/Info.plist
      properties:
        CFBundleDisplayName: 빠른 체크리스트
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
